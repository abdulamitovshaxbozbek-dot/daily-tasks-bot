<!DOCTYPE html>
<!-- MINIAPP NAVIGATION FINAL: weekly/monthly previous-next navigation -->
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qadam</title>
<meta name="qadam-ui-version" content="2026-10-07-tomorrow-planning-v3">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F2E2B;
    --bg-elevated: #163D38;
    --bg-card: #1A4540;
    --border: #24544E;
    --text: #F2EFE6;
    --text-dim: #9FB8B3;
    --accent: #E8B04B;
    --accent-dim: #C99640;
    --success: #6FBF8C;
    --danger: #D97757;
    --radius: 18px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; }

  html {
    scroll-padding-top: env(safe-area-inset-top, 0px);
    height: 100%;
  }

  body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    max-width: 560px;
    margin: 0 auto;
    padding: 20px 18px 32px;
    min-height: 100%;
  }

  /* ---------- Header ---------- */

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .icon-btn {
    width: 44px;
    height: 44px;
    border: 1px solid var(--border);
    border-radius: 50%;
    background: var(--bg-elevated);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    font: inherit;
    font-size: 19px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .icon-btn:active { transform: scale(0.94); }

  .icon-btn.loading { animation: spin 0.8s linear infinite; }

  @keyframes spin { to { transform: rotate(360deg); } }

  .header .greeting {
    font-size: 14px;
    color: var(--text-dim);
    margin: 0 0 2px;
  }

  .header .name {
    font-size: 22px;
    font-weight: 700;
    margin: 0;
  }

  .avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #F2C874);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 17px;
    color: #1A2E1A;
    flex-shrink: 0;
  }

  /* ---------- Tabs ---------- */

  .tabs {
    display: flex;
    gap: 6px;
    background: var(--bg-elevated);
    border-radius: 14px;
    padding: 4px;
    margin-bottom: 20px;
    position: sticky;
    top: calc(env(safe-area-inset-top, 0px) + 6px);
    z-index: 10;
    box-shadow: 0 8px 22px rgba(8, 31, 28, 0.22);
  }

  .tab {
    flex: 1;
    text-align: center;
    padding: 10px 4px;
    border-radius: 10px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text-dim);
    background: transparent;
    border: none;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
    font-family: inherit;
  }

  .tab.active {
    background: var(--accent);
    color: #1A2E1A;
  }

  .period-nav {
    display: grid;
    grid-template-columns: 44px 1fr 44px;
    align-items: center;
    gap: 10px;
    margin: 0 0 12px;
  }

  .period-nav-title {
    min-width: 0;
    text-align: center;
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
  }

  .period-nav-btn {
    width: 44px;
    height: 44px;
    border: 1px solid var(--border);
    border-radius: 13px;
    background: var(--bg-elevated);
    color: var(--text);
    font: inherit;
    font-size: 23px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .period-nav-btn:active:not(:disabled) { transform: scale(0.94); }

  .period-nav-btn:disabled {
    cursor: default;
    opacity: 0.3;
  }

  /* ---------- Progress hero ---------- */

  .hero {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 26px 22px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .ring-wrap {
    position: relative;
    width: 96px;
    height: 96px;
    flex-shrink: 0;
  }

  .ring-wrap svg { transform: rotate(-90deg); }

  .ring-bg {
    fill: none;
    stroke: var(--bg-elevated);
    stroke-width: 9;
  }

  .ring-fg {
    fill: none;
    stroke: var(--accent);
    stroke-width: 9;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.6s cubic-bezier(.4,0,.2,1);
  }

  .ring-label {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  .hero-info { flex: 1; min-width: 0; }

  .hero-count {
    font-size: 15px;
    color: var(--text-dim);
    margin: 0 0 6px;
  }

  .hero-count strong { color: var(--text); font-weight: 700; }

  .hero-period {
    font-size: 13px;
    color: var(--text-dim);
    margin: 0;
  }

  .comparison {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-top: 9px;
    padding: 5px 9px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 700;
    background: rgba(159,184,179,0.12);
    color: var(--text-dim);
  }

  .comparison.up { color: var(--success); background: rgba(111,191,140,0.12); }
  .comparison.down { color: var(--danger); background: rgba(217,119,87,0.12); }

  .metric-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }

  .metric-card {
    min-width: 0;
    padding: 13px 10px;
    text-align: center;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 14px;
  }

  .metric-value { display: block; font-size: 18px; font-weight: 800; }
  .metric-label { display: block; margin-top: 3px; font-size: 10.5px; color: var(--text-dim); }

  /* ---------- Section title ---------- */

  .section-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-dim);
    margin: 22px 2px 10px;
  }

  /* ---------- Task list (daily) ---------- */

  .task-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 8px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }

  .task-icon {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-top: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
  }

  .task-icon.completed { background: rgba(111,191,140,0.18); color: var(--success); }
  .task-icon.failed { background: rgba(217,119,87,0.18); color: var(--danger); }
  .task-icon.pending { background: rgba(159,184,179,0.18); color: var(--text-dim); }

  .task-body { flex: 1; min-width: 0; }

  .task-text {
    font-size: 15px;
    font-weight: 500;
    margin: 0;
    word-break: break-word;
  }

  .task-text.done { color: var(--text-dim); text-decoration: line-through; text-decoration-color: var(--border); }

  .task-reason {
    font-size: 12.5px;
    color: var(--danger);
    margin: 4px 0 0;
  }

  /* ---------- Day/month grid (weekly/monthly) ---------- */

  .grid-list { display: flex; flex-direction: column; gap: 8px; }

  .grid-row {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 13px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .grid-row .bar-wrap {
    flex: 1;
    height: 8px;
    background: var(--bg-elevated);
    border-radius: 999px;
    overflow: hidden;
  }

  .grid-row .bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
  }

  .grid-row .row-label {
    width: 84px;
    flex-shrink: 0;
    font-size: 14px;
    font-weight: 600;
  }

  .grid-row .row-pct {
    width: 42px;
    flex-shrink: 0;
    text-align: right;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--text-dim);
  }

  .grid-row.empty .row-pct,
  .grid-row.empty .row-label { color: var(--text-dim); opacity: 0.55; }

  /* ---------- Weekly chart ---------- */

  .week-chart {
    height: 232px;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    align-items: end;
    gap: 8px;
    padding: 18px 12px 12px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }

  .week-column {
    height: 100%;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
  }

  .week-column[data-day-date] { cursor: pointer; }
  .week-column[data-day-date]:active { transform: scale(0.97); }

  .week-value {
    min-height: 18px;
    margin-bottom: 6px;
    font-size: 10.5px;
    font-weight: 700;
    color: var(--text-dim);
  }

  .week-track {
    width: 100%;
    max-width: 34px;
    height: 155px;
    display: flex;
    align-items: flex-end;
    border-radius: 9px;
    background: var(--bg-elevated);
    overflow: hidden;
  }

  .week-fill {
    width: 100%;
    min-height: 3px;
    border-radius: 9px 9px 0 0;
    background: linear-gradient(180deg, #F2C874, var(--accent));
    transition: height 0.45s ease;
  }

  .week-column.empty .week-fill { background: var(--border); }
  .week-label { margin-top: 8px; font-size: 11px; font-weight: 700; color: var(--text-dim); }

  /* ---------- Monthly calendar ---------- */

  .calendar {
    padding: 14px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }

  .calendar-head,
  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }

  .calendar-head { margin-bottom: 7px; }

  .calendar-weekday {
    text-align: center;
    font-size: 10px;
    font-weight: 700;
    color: var(--text-dim);
  }

  .calendar-day {
    aspect-ratio: 1;
    min-width: 0;
    border: 0;
    border-radius: 10px;
    background: var(--bg-elevated);
    color: var(--text-dim);
    font: inherit;
    font-size: 11px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: default;
  }

  .calendar-day.has-tasks {
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .calendar-day.has-tasks:active { transform: scale(0.92); }

  .calendar-day.blank { visibility: hidden; }
  .calendar-day.low { color: #FFE9E2; background: rgba(217,119,87,0.72); }
  .calendar-day.medium { color: #2E2815; background: rgba(232,176,75,0.82); }
  .calendar-day.high { color: #102E24; background: rgba(111,191,140,0.9); }
  .calendar-day.today { outline: 2px solid var(--text); outline-offset: 2px; }

  .calendar-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 9px 14px;
    margin-top: 14px;
    font-size: 10.5px;
    color: var(--text-dim);
  }

  .legend-item { display: inline-flex; align-items: center; gap: 5px; }
  .legend-dot { width: 9px; height: 9px; border-radius: 3px; background: var(--bg-elevated); }
  .legend-dot.low { background: rgba(217,119,87,0.72); }
  .legend-dot.medium { background: rgba(232,176,75,0.82); }
  .legend-dot.high { background: rgba(111,191,140,0.9); }

  /* ---------- Insight card ---------- */

  .insight {
    background: linear-gradient(135deg, rgba(232,176,75,0.12), rgba(232,176,75,0.03));
    border: 1px solid rgba(232,176,75,0.3);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-top: 18px;
  }

  .insight-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
    margin: 0 0 6px;
  }

  .insight-text {
    font-size: 14px;
    line-height: 1.5;
    color: var(--text);
    margin: 0;
  }

  /* ---------- States ---------- */

  .state-msg {
    text-align: center;
    color: var(--text-dim);
    font-size: 14px;
    padding: 40px 20px;
  }

  .state-icon { display: block; margin-bottom: 10px; font-size: 34px; }

  .retry-btn {
    min-height: 44px;
    margin-top: 15px;
    padding: 10px 18px;
    border: 0;
    border-radius: 12px;
    background: var(--accent);
    color: #1A2E1A;
    font: inherit;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
  }

  .updated-at {
    margin: 18px 0 0;
    text-align: center;
    font-size: 10.5px;
    color: var(--text-dim);
    opacity: 0.75;
  }

  /* ---------- Day details bottom sheet ---------- */

  .sheet-overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-top: env(safe-area-inset-top, 0px);
    background: rgba(3, 16, 14, 0.62);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.2s ease, visibility 0.2s ease;
  }

  .sheet-overlay.open { opacity: 1; visibility: visible; }

  .day-sheet {
    width: min(560px, 100%);
    max-height: 82vh;
    padding: 10px 18px calc(22px + env(safe-area-inset-bottom, 0px));
    overflow-y: auto;
    overscroll-behavior: contain;
    border: 1px solid var(--border);
    border-bottom: 0;
    border-radius: 24px 24px 0 0;
    background: var(--bg-elevated);
    box-shadow: 0 -18px 50px rgba(0,0,0,0.3);
    transform: translateY(24px);
    transition: transform 0.24s cubic-bezier(.2,.8,.2,1);
  }

  .sheet-overlay.open .day-sheet { transform: translateY(0); }
  .sheet-handle { width: 42px; height: 4px; margin: 0 auto 14px; border-radius: 999px; background: var(--border); }

  .sheet-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 16px;
  }

  .sheet-title { margin: 0; font-size: 20px; font-weight: 800; }
  .sheet-subtitle { margin: 4px 0 0; color: var(--text-dim); font-size: 12.5px; }

  .sheet-close {
    width: 40px;
    height: 40px;
    flex: 0 0 auto;
    border: 0;
    border-radius: 50%;
    background: var(--bg-card);
    color: var(--text);
    font: inherit;
    font-size: 19px;
    cursor: pointer;
  }

  .sheet-summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--bg-card);
  }

  .sheet-summary strong { font-size: 18px; }
  .sheet-summary span { font-size: 12px; color: var(--text-dim); }
  body.sheet-open { overflow: hidden; }

  .skeleton {
    background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-elevated) 37%, var(--bg-card) 63%);
    background-size: 400% 100%;
    animation: shimmer 1.4s ease infinite;
    border-radius: 14px;
    height: 64px;
    margin-bottom: 8px;
  }

  @keyframes shimmer {
    0% { background-position: 100% 50%; }
    100% { background-position: 0 50%; }
  }

  @media (prefers-reduced-motion: reduce) {
    .ring-fg { transition: none; }
    .skeleton { animation: none; }
  }

  @media (max-width: 370px) {
    .app { padding-left: 12px; padding-right: 12px; }
    .hero { padding: 20px 16px; gap: 14px; }
    .ring-wrap, .ring-wrap svg { width: 84px; height: 84px; }
    .week-chart { gap: 5px; padding-left: 8px; padding-right: 8px; }
  }

  /* Tahrirlash va o'chirish boshqaruvlari mavjud dizayn ranglarida. */
  .task-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .task-actions button, .tomorrow-btn, .task-dialog button {
    font: inherit; font-size: 13px; border: 1px solid var(--border); border-radius: 12px;
    background: rgba(159,184,179,.08); color: var(--text); padding: 10px 14px; cursor: pointer;
    min-height: 44px;
  }
  .task-actions .task-action-icon {
    width: 42px; min-width: 42px; height: 42px; min-height: 42px; padding: 0;
    display: inline-grid; place-items: center; border-radius: 13px;
    transition: transform .16s ease, background .16s ease, border-color .16s ease;
  }
  .task-action-icon svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .task-action-icon:hover { transform: translateY(-1px); background: rgba(197,232,188,.16); border-color: rgba(197,232,188,.62); }
  .task-action-icon:focus-visible { outline: 2px solid #c5e8bc; outline-offset: 3px; }
  .task-actions .task-delete { color: #f6a89e; }
  .task-actions .task-delete:hover { background: rgba(255,180,169,.14); border-color: rgba(255,180,169,.62); }
  .tomorrow-btn { width: 100%; margin-bottom: 16px; text-align: left; }
  .task-dialog { width: calc(100% - 32px); max-width: 420px; box-sizing: border-box;
    border: 1px solid var(--border); border-radius: 22px; padding: 24px;
    background: #133b36; color: var(--text); max-height: 85vh; overflow: auto;
  }
  .task-dialog::backdrop { background: rgba(0,0,0,.65); }
  .task-dialog h2 { font-size: 20px; margin: 0 0 12px; }
  .task-dialog p { line-height: 1.5; overflow-wrap: anywhere; }
  .task-dialog label { display: block; margin: 16px 0 8px; }
  .task-dialog [hidden] { display: none; }
  .task-dialog textarea { box-sizing: border-box; width: 100%; min-height: 100px; padding: 12px;
    border: 1px solid var(--border); border-radius: 12px; background: #0f2e2b; color: var(--text); font: inherit; }
  .task-dialog input[type="time"] { box-sizing: border-box; width: 100%; min-height: 46px; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: 12px; background: #0f2e2b; color: var(--text); font: inherit; }
  .task-dialog-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
  .task-dialog .primary { background: #c5e8bc; color: #0f2e2b; font-weight: 600; }
  .task-dialog .danger { background: #ffb4a9; }
  .task-dialog button:disabled { opacity: .5; cursor: wait; }
  .task-error { color: #ffb4a9; font-size: 13px; }
  .task-notice { margin: 0 0 12px; font-size: 13px; color: var(--text-dim); }
  .task-notice:empty { display: none; }

</style>
<style>
  /* Dashboard hierarchy: task-only summary, then tasks, analysis and recent days. */
  .header { margin-bottom:18px; }
  .journey-nav { position:sticky; top:6px; z-index:12; background:var(--bg-elevated); margin-bottom:18px; }
  .journey-nav button[aria-selected="true"] { background:var(--accent); color:var(--bg); }
  .tabs { position:static; box-shadow:none; }
  .today-summary { padding:16px; border:1px solid var(--border); border-radius:18px; background:var(--bg-card); }
  .summary-line { display:flex; align-items:center; justify-content:space-between; font-size:14px; font-weight:700; }
  .summary-line strong { font-size:26px; color:var(--accent); }
  .summary-track { height:6px; border-radius:99px; background:var(--bg-elevated); overflow:hidden; margin:10px 0; }
  .summary-track div { height:100%; background:var(--accent); border-radius:inherit; }
  .today-summary p { margin:0 0 7px; font-size:12px; color:var(--text-dim); line-height:1.7; }
  .today-summary p strong { color:var(--text); }
  .task-heading { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:20px 0 12px; }
  .task-heading h2,.daily-analysis h2 { margin:0; font-size:16px; }
  .daily-analysis { margin:22px 0; padding:16px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:18px; }
  .daily-analysis .insight { background:none; border:0; padding:0; margin-top:12px; }
  .daily-analysis>.insight-text { margin-top:10px; }
  .compact-chart { height:142px; padding:12px 8px; gap:5px; }
  .compact-chart .week-track { height:72px; max-width:24px; }
  .compact-chart .week-column { border:0; background:none; color:var(--text); padding:0; font:inherit; }
  .compact-chart .week-label { font-size:9px; white-space:nowrap; }
  .task-actions { gap:6px; margin-top:9px; }
  #journeyPanel:empty { padding:0; }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div>
      <p class="greeting" id="greeting">Xush kelibsiz</p>
      <p class="name" id="userName">&nbsp;</p>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="refreshBtn" type="button" aria-label="Ma’lumotlarni yangilash">↻</button>
      <div class="avatar" id="avatarInitial">?</div>
    </div>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab active" data-period="daily" role="tab" aria-selected="true">Kunlik</button>
    <button class="tab" data-period="weekly" role="tab" aria-selected="false">Hafta</button>
    <button class="tab" data-period="monthly" role="tab" aria-selected="false">Oy</button>
    <button class="tab" data-period="yearly" role="tab" aria-selected="false">Yil</button>
  </div>

  <p id="taskNotice" class="task-notice" role="status" aria-live="polite"></p>
  <div id="content">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </div>
</div>

<div class="sheet-overlay" id="daySheetOverlay" aria-hidden="true">
  <section class="day-sheet" id="daySheet" role="dialog" aria-modal="true" aria-labelledby="daySheetTitle">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div>
        <h2 class="sheet-title" id="daySheetTitle">Kun tafsilotlari</h2>
        <p class="sheet-subtitle" id="daySheetSubtitle"></p>
      </div>
      <button class="sheet-close" id="daySheetClose" type="button" aria-label="Yopish">✕</button>
    </div>
    <div id="daySheetContent"></div>
  </section>
</div>

<dialog id="taskDialog" class="task-dialog" aria-labelledby="taskDialogTitle" aria-describedby="taskDialogText">
  <form id="taskForm">
    <h2 id="taskDialogTitle"></h2>
    <p id="taskDialogText"></p>
    <label id="taskInputLabel" for="taskInput">Vazifa matni</label>
    <textarea id="taskInput" maxlength="1000" rows="3"></textarea>
    <label id="reminderTimeLabel" for="reminderTime" hidden>Eslatma vaqti</label>
    <input id="reminderTime" type="time" hidden>
    <p id="taskError" class="task-error" role="alert"></p>
    <div class="task-dialog-actions">
      <button id="taskCancel" type="button">Bekor qilish</button>
      <button id="taskSubmit" class="primary" type="submit">Saqlash</button>
    </div>
  </form>
</dialog>

<dialog id="tomorrowTaskDialog" class="task-dialog" aria-labelledby="tomorrowTaskTitle">
  <form id="tomorrowTaskForm">
    <h2 id="tomorrowTaskTitle">Ertangi vazifa</h2>
    <p id="tomorrowTaskDate"></p>
    <label for="tomorrowTaskInput">Nima qilmoqchisiz?</label>
    <textarea id="tomorrowTaskInput" maxlength="1000" rows="3" required placeholder="Masalan, 20 daqiqa ingliz tili o‘rganish"></textarea>
    <p id="tomorrowTaskError" class="task-error" role="alert"></p>
    <div class="task-dialog-actions">
      <button id="tomorrowTaskCancel" type="button">Bekor qilish</button>
      <button id="tomorrowTaskSubmit" class="primary" type="submit">Ertagaga saqlash</button>
    </div>
  </form>
</dialog>

<script>
(function () {
  const tg = window.Telegram && window.Telegram.WebApp;

  if (tg) {
    tg.ready();
    tg.expand();
    if (tg.setHeaderColor) { try { tg.setHeaderColor('#0F2E2B'); } catch (e) {} }
    if (tg.setBackgroundColor) { try { tg.setBackgroundColor('#0F2E2B'); } catch (e) {} }
  }

  const initData = tg ? tg.initData : '';
  const tgUser = tg && tg.initDataUnsafe ? tg.initDataUnsafe.user : null;

  const API_BASE = window.location.origin + '/api/miniapp';

  const contentEl = document.getElementById('content');
  const userNameEl = document.getElementById('userName');
  const greetingEl = document.getElementById('greeting');
  const avatarEl = document.getElementById('avatarInitial');
  const refreshBtn = document.getElementById('refreshBtn');
  const daySheetOverlay = document.getElementById('daySheetOverlay');
  const daySheetClose = document.getElementById('daySheetClose');
  const daySheetTitle = document.getElementById('daySheetTitle');
  const daySheetSubtitle = document.getElementById('daySheetSubtitle');
  const daySheetContent = document.getElementById('daySheetContent');

  const cache = {};
  let currentPeriod = 'daily';
  let lastUpdatedAt = null;
  let selectedWeekStart = null;
  let selectedMonthYear = null;
  let selectedMonth = null;

  // Vazifa amallari Mini Appda bajariladi; sana va status o'zgarmaydi.
  const taskRegistry = new Map();
  const taskDialog = document.getElementById('taskDialog');
  const taskForm = document.getElementById('taskForm');
  const taskInput = document.getElementById('taskInput');
  const taskInputLabel = document.getElementById('taskInputLabel');
  const reminderTime = document.getElementById('reminderTime');
  const reminderTimeLabel = document.getElementById('reminderTimeLabel');
  const taskDialogTitle = document.getElementById('taskDialogTitle');
  const taskDialogText = document.getElementById('taskDialogText');
  const taskError = document.getElementById('taskError');
  const taskSubmit = document.getElementById('taskSubmit');
  const taskCancel = document.getElementById('taskCancel');
  let chosenTask = null;
  let taskAction = null;
  let taskBusy = false;
  let openSheetDate = null;
  let daySheetCanAdd = false;
  let dayRequest = 0;
  let periodRequest = 0;

  function taskActionsMarkup(task) {
    taskRegistry.set(String(task.id), task);
    if (!task.can_manage) return '';
    const id = encodeURIComponent(task.id);
    const reminderLabel = task.reminder_time ? 'Eslatma: ' + task.reminder_time : 'Eslatma qo‘yish';
    return '<div class="task-actions">' +
      '<button type="button" class="task-action-icon" data-task-action="reminder" data-task-id="' + id + '" aria-label="' + reminderLabel + '" title="' + reminderLabel + '">🔔</button>' +
      (task.reminder_time ? '<button type="button" class="task-action-icon" data-task-action="clear-reminder" data-task-id="' + id + '" aria-label="Eslatmani o‘chirish" title="Eslatmani o‘chirish">🔕</button>' : '') +
      '<button type="button" class="task-action-icon" data-task-action="edit" data-task-id="' + id + '" aria-label="Vazifani tahrirlash" title="Tahrirlash">' +
        '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>' +
      '</button>' +
      '<button type="button" class="task-action-icon task-delete" data-task-action="delete" data-task-id="' + id + '" aria-label="Vazifani o‘chirish" title="O‘chirish">' +
        '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v5M14 11v5"/></svg>' +
      '</button></div>';
  }

  function openTaskDialog(event) {
    const button = event.target.closest('[data-task-action]');
    if (!button) return;
    const task = taskRegistry.get(decodeURIComponent(button.dataset.taskId));
    if (!task || !task.can_manage) return;
    chosenTask = task;
    taskAction = button.dataset.taskAction;
    const editing = taskAction === 'edit';
    const reminding = taskAction === 'reminder';
    const clearingReminder = taskAction === 'clear-reminder';
    taskDialogTitle.textContent = editing ? 'Vazifani tahrirlash' : (reminding ? 'Eslatma qo‘yish' : (clearingReminder ? 'Eslatmani o‘chirish' : 'Vazifani o‘chirish'));
    taskDialogText.textContent = editing ? 'Vazifaning sanasi o‘zgarmaydi.' : (reminding ? '“' + task.task_text + '” uchun vaqtni tanlang.' : (clearingReminder ? '“' + task.task_text + '” eslatmasini o‘chirasizmi?' : '“' + task.task_text + '” vazifasini o‘chirasizmi?'));
    taskInputLabel.hidden = !editing;
    taskInput.hidden = !editing;
    taskInput.disabled = !editing;
    reminderTimeLabel.hidden = !reminding;
    reminderTime.hidden = !reminding;
    reminderTime.disabled = !reminding;
    taskInput.value = task.task_text;
    reminderTime.value = task.reminder_time || '';
    taskSubmit.textContent = (editing || reminding) ? 'Saqlash' : 'Ha, o‘chirish';
    taskSubmit.classList.toggle('danger', !(editing || reminding));
    taskError.textContent = '';
    taskDialog.showModal();
    (editing ? taskInput : (reminding ? reminderTime : taskCancel)).focus();
  }

  contentEl.addEventListener('click', openTaskDialog);
  daySheetContent.addEventListener('click', openTaskDialog);
  taskCancel.addEventListener('click', function () { if (!taskBusy) taskDialog.close(); });
  taskDialog.addEventListener('cancel', function (event) { if (taskBusy) event.preventDefault(); });
  taskForm.addEventListener('submit', function (event) {
    event.preventDefault();
    if (taskBusy || !chosenTask) return;
    const text = taskInput.value.trim();
    const reminderValue = reminderTime.value;
    if (taskAction === 'edit' && (!text || text.length > 1000 || /[\r\n]/.test(text))) {
      taskError.textContent = 'Vazifani 1–1000 belgili bitta qatorda yozing.';
      taskInput.focus();
      return;
    }
    if (taskAction === 'reminder' && !/^([01]\d|2[0-3]):[0-5]\d$/.test(reminderValue)) {
      taskError.textContent = 'Eslatma vaqtini tanlang.';
      reminderTime.focus();
      return;
    }
    taskBusy = true;
    taskSubmit.disabled = true;
    taskCancel.disabled = true;
    taskInput.disabled = true;
    reminderTime.disabled = true;
    taskError.textContent = '';
    const editing = taskAction === 'edit';
    const reminding = taskAction === 'reminder';
    const clearingReminder = taskAction === 'clear-reminder';
    const path = '/tasks/' + encodeURIComponent(chosenTask.id) + (reminding || clearingReminder ? '/reminder' : '');
    apiFetch(path, {
      method: reminding ? 'PUT' : (clearingReminder ? 'DELETE' : (editing ? 'PATCH' : 'DELETE')),
      headers: {'Content-Type': 'application/json'},
      ...((editing || reminding) ? {body: JSON.stringify(editing ? {task_text: text} : {reminder_time: reminderValue})} : {})
    }).then(function (result) {
      taskDialog.close();
      Object.keys(cache).forEach(function (key) { delete cache[key]; });
      taskRegistry.clear();
      document.getElementById('taskNotice').textContent =
        (reminding ? 'Eslatma saqlandi: ' + reminderValue + '.' : (clearingReminder ? 'Eslatma o‘chirildi.' : (editing ? 'Vazifa yangilandi.' : 'Vazifa o‘chirildi.'))) +
        (result.checklist_updated === false ? ' Botdagi ro‘yxat keyingi yangilanishda moslashadi.' : '');
      loadPeriod(currentPeriod, true);
      if (openSheetDate) openDaySheet(openSheetDate);
      haptic('light');
    }).catch(function (error) {
      taskError.textContent = error.message || 'Amal bajarilmadi. Qayta urinib ko‘ring.';
    }).finally(function () {
      taskBusy = false;
      taskSubmit.disabled = false;
      taskCancel.disabled = false;
      taskInput.disabled = !editing;
      reminderTime.disabled = !reminding;
    });
  });

  const monthNames = [
    'Yanvar', 'Fevral', 'Mart', 'Aprel', 'May', 'Iyun',
    'Iyul', 'Avgust', 'Sentabr', 'Oktabr', 'Noyabr', 'Dekabr'
  ];

  function haptic(style) {
    if (tg && tg.HapticFeedback) {
      try { tg.HapticFeedback.impactOccurred(style || 'light'); } catch (e) {}
    }
  }

  function shortDate(iso) {
    if (!iso) return '';
    const parts = iso.split('-');
    return parts.length === 3 ? parts[2] + '.' + parts[1] + '.' + parts[0] : iso;
  }

  function periodNavMarkup(type, title, canGoNext) {
    return '<div class="period-nav">' +
      '<button class="period-nav-btn" type="button" data-period-nav="previous" data-nav-type="' + type + '" aria-label="Oldingi davr">‹</button>' +
      '<div class="period-nav-title">' + escapeHtml(title) + '</div>' +
      '<button class="period-nav-btn" type="button" data-period-nav="next" data-nav-type="' + type + '" aria-label="Keyingi davr"' +
        (canGoNext ? '' : ' disabled') + '>›</button>' +
    '</div>';
  }

  function addDays(iso, amount) {
    const value = new Date(iso + 'T12:00:00');
    value.setDate(value.getDate() + amount);
    return value.getFullYear() + '-' + String(value.getMonth() + 1).padStart(2, '0') + '-' + String(value.getDate()).padStart(2, '0');
  }

  function changeMonth(year, month, amount) {
    const value = new Date(year, month - 1 + amount, 1, 12, 0, 0);
    return { year: value.getFullYear(), month: value.getMonth() + 1 };
  }

  function updatedMarkup() {
    if (!lastUpdatedAt) return '';
    return '<p class="updated-at">Yangilandi: ' +
      String(lastUpdatedAt.getHours()).padStart(2, '0') + ':' +
      String(lastUpdatedAt.getMinutes()).padStart(2, '0') + '</p>';
  }

  function metricMarkup(completed, failed, pending) {
    return '<div class="metric-grid">' +
      '<div class="metric-card"><span class="metric-value">' + completed + '</span><span class="metric-label">Bajarildi</span></div>' +
      '<div class="metric-card"><span class="metric-value">' + failed + '</span><span class="metric-label">Bajarilmadi</span></div>' +
      '<div class="metric-card"><span class="metric-value">' + pending + '</span><span class="metric-label">Kutilmoqda</span></div>' +
    '</div>';
  }

  function comparisonMarkup(current, previous) {
    if (!previous || !previous.total) return '<span class="comparison">Kecha ma’lumot yo‘q</span>';
    const difference = current.percent - previous.percent;
    if (difference > 0) return '<span class="comparison up">↑ Kechagidan ' + difference + '% yaxshi</span>';
    if (difference < 0) return '<span class="comparison down">↓ Kechagidan ' + Math.abs(difference) + '% past</span>';
    return '<span class="comparison">＝ Kechagi natija bilan teng</span>';
  }

  function greetingForHour() {
    const h = new Date().getHours();
    if (h < 12) return 'Xayrli tong';
    if (h < 18) return 'Assalomu alaykum';
    return 'Xayrli kech';
  }

  function setHeaderName(name) {
    userNameEl.textContent = name || 'Foydalanuvchi';
    avatarEl.textContent = (name || '?').trim().charAt(0).toUpperCase();
    greetingEl.textContent = greetingForHour();
  }

  if (tgUser && tgUser.first_name) {
    setHeaderName(tgUser.first_name);
  }

  function apiFetch(path, options) {
    const url = API_BASE + path + (path.includes('?') ? '&' : '?') +
      'initData=' + encodeURIComponent(initData || '');
    return fetch(url, options).then(function (res) {
      if (!res.ok) {
        return res.json().catch(function () { return {}; }).then(function (body) {
          throw new Error(typeof body.detail === 'string' ? body.detail : ('Xatolik: ' + res.status));
        });
      }
      return res.json();
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  function ringMarkup(percent) {
    const r = 40;
    const c = 2 * Math.PI * r;
    const offset = c - (Math.max(0, Math.min(100, percent)) / 100) * c;
    return (
      '<div class="ring-wrap">' +
        '<svg width="96" height="96" viewBox="0 0 96 96">' +
          '<circle class="ring-bg" cx="48" cy="48" r="' + r + '"></circle>' +
          '<circle class="ring-fg" cx="48" cy="48" r="' + r + '" ' +
            'stroke-dasharray="' + c.toFixed(1) + '" ' +
            'stroke-dashoffset="' + offset.toFixed(1) + '"></circle>' +
        '</svg>' +
        '<div class="ring-label">' + percent + '%</div>' +
      '</div>'
    );
  }

  function insightMarkup(topReason, motivation) {
    let html = '';
    if (motivation && motivation.title) {
      html += (
        '<div class="insight">' +
          '<p class="insight-title">Har kuni maqsad sari bir qadam 👣</p>' +
          '<p class="insight-text">Har kun bir xil o‘tmaydi. Bugun qilingan kichik harakatlar ham muhim. Ertaga qolgan vazifalardan birini davom ettirsangiz bo‘ladi.</p>' +
        '</div>'
      );
    }
    if (topReason && topReason.display) {
      const reasonMissing = topReason.display === 'sababi yozilmadi';
      const reasonText = reasonMissing
        ? 'Ayrim vazifalarda sabab ko‘rsatilmagan. Keyingi safar qisqacha sabab yozish, qaysi joy qiyin bo‘lganini tushunishga yordam beradi.'
        : '“' + topReason.display + '” sababi ' + topReason.count + ' marta qayd etilgan. Keyingi rejalarda shu joyni hisobga olib, eslatma yoki kichikroq vazifadan boshlash foydali bo‘lishi mumkin.';
      html += (
        '<div class="insight" style="margin-top:10px;">' +
          '<p class="insight-title">E’tibor berish mumkin bo‘lgan joy</p>' +
          '<p class="insight-text">' + escapeHtml(reasonText) + '</p>' +
        '</div>'
      );
    }
    return html;
  }

  function renderDaily(data) {
    window.qadamDaily = data;
    if (window.qadamDailyChanged) window.qadamDailyChanged();
    const s = data.stats;
    const pending = s.pending == null ? Math.max(0, s.total - s.completed - (s.failed || 0)) : s.pending;
    let html = '<section class="today-summary" aria-label="Bugungi natija">' +
      '<div class="summary-line"><span>Bugungi natija</span><strong>' + s.percent + '%</strong></div>' +
      '<div class="summary-track"><div style="width:' + Math.max(0, Math.min(100, Number(s.percent) || 0)) + '%"></div></div>' +
      '<p><strong>' + s.completed + '/' + s.total + ' bajarildi</strong> · ' + (s.failed || 0) + ' bajarilmadi · ' + pending + ' qoldi</p>' +
      '<span class="hero-period">' + escapeHtml(shortDate(data.date)) + '</span></section>';
    html += '<div class="task-heading"><h2>Bugungi vazifalar</h2><button type="button" class="j-btn" data-dashboard-add>+ Vazifa</button></div>';

    if (!data.tasks.length) {
      html += '<div class="state-msg"><span class="state-icon">📝</span>Bugun uchun vazifalar hali qo‘shilmagan</div>';
    } else {
      data.tasks.slice().sort(function (a,b) { return Number(a.status!=='pending')-Number(b.status!=='pending'); }).forEach(function (t) {
        const iconClass = t.status === 'completed' ? 'completed' : (t.status === 'failed' ? 'failed' : 'pending');
        const icon = t.status === 'completed' ? '✓' : (t.status === 'failed' ? '✕' : '⏳');
        html += (
          '<div class="task-card">' +
            '<div class="task-icon ' + iconClass + '">' + icon + '</div>' +
            '<div class="task-body">' +
              '<p class="task-text' + (t.status === 'completed' ? ' done' : '') + '">' + escapeHtml(t.task_text) + '</p>' +
              (t.status === 'failed' ? '<p class="task-reason">' + escapeHtml(t.fail_reason_display || 'sababi yozilmadi') + '</p>' : '') +
              taskActionsMarkup(t) +
            '</div>' +
          '</div>'
        );
      });
    }

    html += '<button type="button" class="tomorrow-btn" data-day-date="' + escapeHtml(data.tomorrow || addDays(data.date, 1)) + '">🌅 Ertangi vazifalarni ochish →</button>';
    html += '<section class="daily-analysis"><h2>Bugungi tahlil</h2>' + comparisonMarkup(s, data.yesterday && data.yesterday.stats) +
      (insightMarkup(data.top_fail_reason, data.motivation) || '<p class="insight-text">' + (s.total ? 'Bugungi natijangiz vazifalar holatiga qarab yangilanadi.' : 'Birinchi vazifani yozing — natijangiz shu yerda ko‘rinadi.') + '</p>') + '</section>';
    html += '<section class="recent-progress"><div class="task-heading"><h2>7 kunlik progress</h2><button type="button" class="j-btn" data-dashboard-stats>Barchasi →</button></div><div id="recentWeek" role="status">Yuklanmoqda…</div></section>' + updatedMarkup();
    contentEl.innerHTML = html;
    loadRecentWeek(data.date);
  }

  let recentRequest = 0;
  function loadRecentWeek(date) {
    const token = ++recentRequest;
    // The backend accepts Monday starts only. Merge the weeks covering this window.
    const firstDate = addDays(date, -6);
    function mondayFor(iso) {
      const weekday = new Date(iso + 'T12:00:00Z').getUTCDay();
      return addDays(iso, -((weekday + 6) % 7));
    }
    const starts = Array.from(new Set([mondayFor(firstDate), mondayFor(date)]));
    const paths = starts.map(start => '/weekly?start=' + encodeURIComponent(start));
    const target = document.getElementById('recentWeek');
    const show = data => {
      if (token !== recentRequest || !target.isConnected) return;
      target.innerHTML = '<div class="week-chart compact-chart">' + data.days.map(d =>
        '<button type="button" class="week-column' + (d.total ? '' : ' empty') + '" data-day-date="' + escapeHtml(d.date) + '" aria-label="' + escapeHtml(shortDate(d.date)) + ': ' + d.completed + '/' + d.total + ' bajarildi">' +
        '<span class="week-value">' + (d.total ? d.percent + '%' : '—') + '</span><span class="week-track"><span class="week-fill" style="height:' + Math.max(0, Math.min(100, Number(d.percent) || 0)) + '%"></span></span><span class="week-label">' + escapeHtml(shortDate(d.date).slice(0, 5)) + '</span></button>'
      ).join('') + '</div>';
    };
    Promise.all(paths.map(path => cache[path] ? Promise.resolve(cache[path]) :
      apiFetch(path).then(data => { cache[path] = data; return data; })
    )).then(weeks => {
      const byDate = new Map();
      weeks.forEach(week => week.days.forEach(day => byDate.set(day.date, day)));
      const days = Array.from({length:7}, (_, index) => {
        const dayDate = addDays(firstDate, index);
        const day = byDate.get(dayDate);
        if (!day) throw new Error('Kunlik progress ma’lumoti yetishmayapti.');
        return day;
      });
      show({days});
    }).catch(error => {
      if (token === recentRequest && target.isConnected) target.innerHTML = '<p class="hero-period">' + escapeHtml(error.message || 'Progressni yuklab bo‘lmadi.') + '</p><button type="button" class="j-btn" data-retry-week="' + escapeHtml(date) + '">Qayta urinish</button>';
    });
  }
  contentEl.addEventListener('click', event => {
    const retry = event.target.closest('[data-retry-week]');
    if (retry) loadRecentWeek(retry.dataset.retryWeek);
  });

  function renderWeekly(data) {
    const s = data.stats;
    selectedWeekStart = data.start_date;
    let html = periodNavMarkup(
      'weekly',
      shortDate(data.start_date) + ' — ' + shortDate(data.end_date),
      data.can_go_next
    );
    html += '<div class="hero">' +
      ringMarkup(s.percent) +
      '<div class="hero-info">' +
        '<p class="hero-count"><strong>' + s.completed + '</strong> / ' + s.total + ' vazifa bajarildi</p>' +
        '<p class="hero-period">' + escapeHtml(shortDate(data.start_date)) + ' — ' + escapeHtml(shortDate(data.end_date)) + '</p>' +
      '</div>' +
    '</div>';

    html += metricMarkup(s.completed, s.failed || 0, s.pending || 0);
    html += '<p class="section-title">HAFTA KUNLARI</p><div class="week-chart">';
    data.days.forEach(function (d) {
      const empty = d.total === 0;
      html += (
        '<div class="week-column' + (empty ? ' empty' : '') + '"' +
          (empty ? '' : ' data-day-date="' + escapeHtml(d.date) + '" role="button" tabindex="0"') +
          ' title="' + escapeHtml(d.name) + ': ' + (empty ? 'ma’lumot yo‘q' : d.completed + '/' + d.total) + '">' +
          '<div class="week-value">' + (empty ? '—' : d.percent + '%') + '</div>' +
          '<div class="week-track"><div class="week-fill" style="height:' + (empty ? 0 : d.percent) + '%"></div></div>' +
          '<div class="week-label">' + escapeHtml(d.name.slice(0, 2)) + '</div>' +
        '</div>'
      );
    });
    html += '</div>';

    html += insightMarkup(data.top_fail_reason, data.motivation) + updatedMarkup();
    contentEl.innerHTML = html;
  }

  function renderMonthly(data) {
    const s = data.stats;
    const selectedStart = new Date(data.start_date + 'T12:00:00');
    selectedMonthYear = selectedStart.getFullYear();
    selectedMonth = selectedStart.getMonth() + 1;
    let html = periodNavMarkup(
      'monthly',
      monthNames[selectedMonth - 1] + ' ' + selectedMonthYear,
      data.can_go_next
    );
    html += '<div class="hero">' +
      ringMarkup(s.percent) +
      '<div class="hero-info">' +
        '<p class="hero-count"><strong>' + s.completed + '</strong> / ' + s.total + ' vazifa bajarildi</p>' +
        '<p class="hero-period">' + escapeHtml(shortDate(data.start_date)) + ' — ' + escapeHtml(shortDate(data.end_date)) + '</p>' +
      '</div>' +
    '</div>';

    html += metricMarkup(s.completed, s.failed || 0, s.pending || 0);
    html += '<p class="section-title">OYLIK FAOLLIK</p>' + calendarMarkup(data);

    html += insightMarkup(data.top_fail_reason, data.motivation) + updatedMarkup();
    contentEl.innerHTML = html;
  }

  function calendarMarkup(data) {
    const start = new Date(data.start_date + 'T00:00:00');
    const year = start.getFullYear();
    const month = start.getMonth();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const mondayOffset = (start.getDay() + 6) % 7;
    const byDay = {};
    data.days.forEach(function (d) { byDay[Number(d.date.slice(-2))] = d; });

    let html = '<div class="calendar"><div class="calendar-head">';
    ['Du', 'Se', 'Cho', 'Pa', 'Ju', 'Sha', 'Ya'].forEach(function (name) {
      html += '<div class="calendar-weekday">' + name + '</div>';
    });
    html += '</div><div class="calendar-grid">';

    for (let i = 0; i < mondayOffset; i++) html += '<div class="calendar-day blank"></div>';
    for (let day = 1; day <= daysInMonth; day++) {
      const d = byDay[day];
      let level = '';
      if (d) level = d.percent >= 80 ? ' high' : (d.percent >= 50 ? ' medium' : ' low');
      const iso = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
      const now = new Date();
      const todayIso = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
      const isToday = iso === todayIso;
      const title = d ? (d.completed + '/' + d.total + ' — ' + d.percent + '%') : 'Vazifa yo‘q';
      html += '<div class="calendar-day' + level + (d ? ' has-tasks' : '') + (isToday ? ' today' : '') + '"' +
        (d ? ' data-day-date="' + iso + '" role="button" tabindex="0"' : '') +
        ' title="' + title + '">' + day + '</div>';
    }

    html += '</div><div class="calendar-legend">' +
      '<span class="legend-item"><i class="legend-dot"></i>Vazifa yo‘q</span>' +
      '<span class="legend-item"><i class="legend-dot low"></i>1–49%</span>' +
      '<span class="legend-item"><i class="legend-dot medium"></i>50–79%</span>' +
      '<span class="legend-item"><i class="legend-dot high"></i>80–100%</span>' +
    '</div></div>';
    return html;
  }

  function renderYearly(data) {
    const s = data.stats;
    let html = '<div class="hero">' +
      ringMarkup(s.percent) +
      '<div class="hero-info">' +
        '<p class="hero-count"><strong>' + s.completed + '</strong> / ' + s.total + ' vazifa bajarildi</p>' +
        '<p class="hero-period">' + escapeHtml(data.year + '-yil') + '</p>' +
      '</div>' +
    '</div>';

    html += metricMarkup(s.completed, s.failed || 0, s.pending || 0);
    html += '<p class="section-title">OYLAR BO‘YICHA</p><div class="grid-list">';
    if (!data.months.length) {
      html += '<div class="state-msg"><span class="state-icon">📊</span>Bu yil uchun ma’lumot yo‘q</div>';
    } else {
      data.months.forEach(function (m) {
        html += (
          '<div class="grid-row">' +
            '<div class="row-label">' + escapeHtml(m.month_name) + '</div>' +
            '<div class="bar-wrap"><div class="bar-fill" style="width:' + m.percent + '%"></div></div>' +
            '<div class="row-pct">' + m.percent + '%</div>' +
          '</div>'
        );
      });
    }
    html += '</div>';

    html += insightMarkup(data.top_fail_reason, data.motivation) + updatedMarkup();
    contentEl.innerHTML = html;
  }

  const renderers = {
    daily: renderDaily,
    weekly: renderWeekly,
    monthly: renderMonthly,
    yearly: renderYearly
  };

  function showSkeleton() {
    contentEl.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
  }

  function showError(message) {
    contentEl.innerHTML = '<div class="state-msg"><span class="state-icon">⚠️</span>' +
      escapeHtml(message) + '<br><button class="retry-btn" id="retryBtn" type="button">Qayta urinish</button></div>';
    const retryBtn = document.getElementById('retryBtn');
    if (retryBtn) retryBtn.addEventListener('click', function () { loadPeriod(currentPeriod, true); });
  }

  function openDaySheet(selectedDate) {
    openSheetDate = selectedDate;
    daySheetCanAdd = false;
    const request = ++dayRequest;
    haptic('light');
    daySheetTitle.textContent = shortDate(selectedDate);
    daySheetSubtitle.textContent = 'Vazifalar yuklanmoqda…';
    daySheetContent.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>';
    daySheetOverlay.classList.add('open');
    daySheetOverlay.setAttribute('aria-hidden', 'false');
    document.body.classList.add('sheet-open');

    apiFetch('/day?date=' + encodeURIComponent(selectedDate))
      .then(function (data) {
        if (request === dayRequest && openSheetDate === selectedDate) renderDaySheet(data);
      })
      .catch(function (err) {
        if (request !== dayRequest || openSheetDate !== selectedDate) return;
        daySheetSubtitle.textContent = '';
        daySheetContent.innerHTML = '<div class="state-msg"><span class="state-icon">⚠️</span>' +
          escapeHtml(err.message || 'Vazifalarni yuklab bo‘lmadi') + '</div>';
      });
  }

  function renderDaySheet(data) {
    const s = data.stats;
    daySheetCanAdd = Boolean(data.can_add);
    daySheetTitle.textContent = shortDate(data.date);
    daySheetSubtitle.textContent = s.total ? (s.completed + ' / ' + s.total + ' vazifa bajarildi') : 'Vazifa yo‘q';

    let html = '<div class="sheet-summary"><div><strong>' + s.percent + '%</strong><br><span>Kun natijasi</span></div>' +
      '<span>' + s.completed + ' bajarildi · ' + s.failed + ' bajarilmadi · ' + s.pending + ' kutilmoqda</span></div>';

    if (data.can_add) html += '<div class="task-heading"><h2>Ertangi vazifalar</h2><button type="button" class="j-btn" data-add-tomorrow>+ Vazifa</button></div>';
    if (!data.tasks.length) {
      html += '<div class="state-msg"><span class="state-icon">📝</span>' + (data.can_add ? 'Ertangi rejangizni shu yerda yozing.' : 'Bu kunda vazifalar bo‘lmagan') + '</div>';
    } else {
      data.tasks.forEach(function (t) {
        const iconClass = t.status === 'completed' ? 'completed' : (t.status === 'failed' ? 'failed' : 'pending');
        const icon = t.status === 'completed' ? '✓' : (t.status === 'failed' ? '✕' : '⏳');
        html += '<div class="task-card">' +
          '<div class="task-icon ' + iconClass + '">' + icon + '</div>' +
          '<div class="task-body"><p class="task-text' + (t.status === 'completed' ? ' done' : '') + '">' + escapeHtml(t.task_text) + '</p>' +
          (t.status === 'failed' ? '<p class="task-reason">Sabab: ' + escapeHtml(t.fail_reason_display || 'yozilmagan') + '</p>' : '') +
          taskActionsMarkup(t) +
          '</div></div>';
      });
    }

    daySheetContent.innerHTML = html;
  }

  const tomorrowDialog = document.getElementById('tomorrowTaskDialog');
  const tomorrowForm = document.getElementById('tomorrowTaskForm');
  const tomorrowInput = document.getElementById('tomorrowTaskInput');
  const tomorrowError = document.getElementById('tomorrowTaskError');
  const tomorrowSubmit = document.getElementById('tomorrowTaskSubmit');
  const tomorrowCancel = document.getElementById('tomorrowTaskCancel');
  let tomorrowBusy = false, tomorrowDate = null, tomorrowRequestId = null, tomorrowPayload = null;
  daySheetContent.addEventListener('click', event => {
    if (!event.target.closest('[data-add-tomorrow]') || !daySheetCanAdd || tomorrowBusy) return;
    tomorrowDate = openSheetDate;
    tomorrowRequestId = null; tomorrowPayload = null;
    tomorrowInput.value = ''; tomorrowError.textContent = '';
    document.getElementById('tomorrowTaskDate').textContent = '📅 ' + shortDate(tomorrowDate);
    tomorrowDialog.showModal(); tomorrowInput.focus();
  });
  tomorrowCancel.addEventListener('click', () => { if (!tomorrowBusy) tomorrowDialog.close(); });
  tomorrowDialog.addEventListener('cancel', event => { if (tomorrowBusy) event.preventDefault(); });
  tomorrowForm.addEventListener('submit', async event => {
    event.preventDefault(); if (tomorrowBusy) return;
    const text = tomorrowInput.value.trim();
    if (!text || text.length > 1000 || /[\r\n]/.test(text)) {
      tomorrowError.textContent = 'Vazifani 1–1000 belgili bitta qatorda yozing.'; return;
    }
    const signature = tomorrowDate + '\n' + text;
    if (signature !== tomorrowPayload) {
      tomorrowRequestId = crypto.randomUUID(); tomorrowPayload = signature;
    }
    tomorrowBusy = true; tomorrowSubmit.disabled = true; tomorrowCancel.disabled = true; tomorrowInput.disabled = true;
    tomorrowError.textContent = '';
    try {
      const result = await apiFetch('/tasks', {method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({task_text:text, task_date:tomorrowDate, request_id:tomorrowRequestId})});
      // Invalidate dashboard statistics, but keep the user on the tomorrow sheet.
      Object.keys(cache).forEach(key => delete cache[key]);
      document.getElementById('taskNotice').textContent = result.duplicate ? 'Bu vazifa ertangi rejangizda allaqachon bor.' :
        (result.chat_notified ? '✅ Ertangi vazifa saqlandi. Bot chatiga tasdiq yuborildi.' : '✅ Ertangi vazifa saqlandi. Chatga tasdiq yuborilmadi.');
      tomorrowDialog.close();
      if (tg && tg.HapticFeedback) { try { tg.HapticFeedback.notificationOccurred('success'); } catch (_) {} }
      if (openSheetDate === tomorrowDate) openDaySheet(tomorrowDate);
    } catch (error) {
      tomorrowError.textContent = error.message || 'Saqlab bo‘lmadi. Qayta urinib ko‘ring.';
    } finally {
      tomorrowBusy = false; tomorrowSubmit.disabled = false; tomorrowCancel.disabled = false; tomorrowInput.disabled = false;
    }
  });

  function closeDaySheet() {
    openSheetDate = null;
    dayRequest++;
    daySheetOverlay.classList.remove('open');
    daySheetOverlay.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('sheet-open');
  }

  daySheetClose.addEventListener('click', closeDaySheet);
  daySheetOverlay.addEventListener('click', function (event) {
    if (event.target === daySheetOverlay) closeDaySheet();
  });

  contentEl.addEventListener('click', function (event) {
    const target = event.target.closest('[data-day-date]');
    if (target) openDaySheet(target.dataset.dayDate);
  });

  contentEl.addEventListener('click', function (event) {
    const button = event.target.closest('[data-period-nav]');
    if (!button || button.disabled) return;

    haptic('light');
    const amount = button.dataset.periodNav === 'previous' ? -1 : 1;

    if (button.dataset.navType === 'weekly' && selectedWeekStart) {
      selectedWeekStart = addDays(selectedWeekStart, amount * 7);
      loadPeriod('weekly');
    }

    if (button.dataset.navType === 'monthly' && selectedMonthYear && selectedMonth) {
      const changed = changeMonth(selectedMonthYear, selectedMonth, amount);
      selectedMonthYear = changed.year;
      selectedMonth = changed.month;
      loadPeriod('monthly');
    }
  });

  contentEl.addEventListener('keydown', function (event) {
    const target = event.target.closest('[data-day-date]');
    if (target && (event.key === 'Enter' || event.key === ' ')) {
      event.preventDefault();
      openDaySheet(target.dataset.dayDate);
    }
  });

  function periodPath(period) {
    if (period === 'weekly' && selectedWeekStart) {
      return '/weekly?start=' + encodeURIComponent(selectedWeekStart);
    }

    if (period === 'monthly' && selectedMonthYear && selectedMonth) {
      return '/monthly?year=' + selectedMonthYear + '&month=' + selectedMonth;
    }

    return '/' + period;
  }

  function loadPeriod(period, force) {
    const request = ++periodRequest;
    currentPeriod = period;
    const path = periodPath(period);
    const cacheKey = path;

    if (!force && cache[cacheKey]) {
      renderers[period](cache[cacheKey]);
      return;
    }

    refreshBtn.classList.add('loading');
    showSkeleton();

    apiFetch(path)
      .then(function (data) {
        if (request !== periodRequest) return;
        cache[cacheKey] = data;
        lastUpdatedAt = new Date();
        refreshBtn.classList.remove('loading');
        if (currentPeriod === period) {
          renderers[period](data);
        }
      })
      .catch(function (err) {
        if (request !== periodRequest) return;
        refreshBtn.classList.remove('loading');
        if (currentPeriod === period) {
          showError(err.message || 'Ma\'lumotni yuklab bo\'lmadi');
        }
      });
  }

  document.querySelectorAll('.tab').forEach(function (btn) {
    btn.addEventListener('click', function () {
      haptic('light');
      document.querySelectorAll('.tab').forEach(function (b) {
        b.classList.remove('active');
        b.setAttribute('aria-selected', 'false');
      });
      btn.classList.add('active');
      btn.setAttribute('aria-selected', 'true');
      loadPeriod(btn.dataset.period);
    });
  });

  refreshBtn.addEventListener('click', function () {
    haptic('medium');
    delete cache[periodPath(currentPeriod)];
    Object.keys(cache).filter(key => key.startsWith('/weekly?start=')).forEach(key => delete cache[key]);
    loadPeriod(currentPeriod, true);
  });

  apiFetch('/me')
    .then(function (data) {
      setHeaderName(data.first_name);
    })
    .catch(function () {
      /* profil olinmasa ham dashboard davom etadi */
    });

  window.qadamTasks = {
    showStatistics: function () {
      const selected = document.querySelector('.tab.active');
      loadPeriod(selected && selected.dataset.period !== 'daily' ? selected.dataset.period : 'weekly');
      document.querySelectorAll('.tab').forEach(b => { const active=b.dataset.period===currentPeriod; b.classList.toggle('active',active); b.setAttribute('aria-selected',String(active)); });
    },
    showDaily: function () {
      document.querySelectorAll('.tab').forEach(function (b) {
        const active = b.dataset.period === 'daily';
        b.classList.toggle('active', active);
        b.setAttribute('aria-selected', String(active));
      });
      loadPeriod('daily', true);
    }
  };
  loadPeriod('daily');
})();
</script>

<script>
(function () {
  'use strict';
  const tg = window.Telegram && window.Telegram.WebApp;
  const app = document.querySelector('.app');
  const tabs = app.querySelector('.tabs');
  const nav = document.createElement('nav');

  async function load() {
    const token=++request;
    if(!model) panel.innerHTML='<div class="j-card" role="status">Ma’lumotlar yuklanmoqda…</div>';
    try { const data=await api('habits'); if(token!==request) return; model=data; render(); }
    catch(e) { if(token!==request) return; panel.innerHTML='<p class="j-warning" role="alert">'+esc(e.message)+'</p>'+btn('Qayta urinish','retry'); }
  }
  function showSection(next) {
    if(next==='add') { showSection('today'); openForm('task-chat'); return; }

    app.setAttribute('data-view',next);
    nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.section===(['today','results'].includes(next)?next:'extras'))));
    tabs.hidden=next!=='results';
    document.getElementById('content').hidden=!['today','results'].includes(next);
    document.getElementById('taskNotice').hidden=!['today','results'].includes(next);
    panel.hidden=false;
    if(window.qadamTasks) { if(next==='today') window.qadamTasks.showDaily(); else if(next==='results') window.qadamTasks.showStatistics(); }
    render(); if(!['today','results'].includes(next)) load();
  }
  window.qadamDailyChanged=()=>{if(section==='today')render();};

  async function mutate(path,method,body) {
    if(busy) return false; busy=true;
    panel.querySelectorAll('button').forEach(b=>b.disabled=true); form.querySelectorAll('button').forEach(b=>b.disabled=true);
    try { const result=await api(path,method,body); notice=result.message||'Saqlandi'; if(tg&&tg.HapticFeedback)tg.HapticFeedback.notificationOccurred('success'); await load(); return true; }
    finally { busy=false; form.querySelectorAll('button').forEach(b=>b.disabled=false); render(); }
  }
  panel.addEventListener('click',async e=>{
    const b=e.target.closest('[data-action]'); if(!b||busy) return;
    const action=b.dataset.action,id=b.dataset.id;
    if(action==='mark') {
      if(b.dataset.status==='later') return openForm('later',{id:Number(id),revision:Number(b.dataset.revision)});
      try { await mutate('habit-entries/'+id,'PUT',{status:b.dataset.status,revision:Number(b.dataset.revision)}); }
      catch(error) { notice=error.message; await load(); }
      return;
    }
    if(action==='section') return showSection(id);
    if(action==='zikr') { openForm('add'); form.querySelector('[name=kind]').value='zikr'; return; }
    if(action==='task-chat') { if(section!=='today')showSection('today'); openForm('task-chat'); return; }
    if(action==='close-app') { if(tg)tg.close(); return; }
    if(action==='retry') return load();
    if(action==='active-list'||action==='archive-list') { archived=action==='archive-list'; render(); return; }
    if(['settings','add','edit','archive','activate','delete'].includes(action)) return openForm(action,id);
  });
  form.addEventListener('click',async e=>{
    if(busy) return;
    if(e.target.closest('[data-task-chat-close]')) {
      if(tg && typeof tg.close==='function') tg.close();
      else { const hint=document.getElementById('jChatNotice'); hint.textContent='Telegramdagi QADAM bot chatini ochib, vazifangizni yuboring.'; hint.hidden=false; }
      return;
    }
    if(e.target.closest('[data-close]')) { dialog.close(); return; }
    const snooze=e.target.closest('[data-snooze]');
    if(snooze) { try { if(await mutate('habit-entries/'+selected.id,'PUT',{status:'s'+snooze.dataset.snooze,revision:selected.revision}))dialog.close(); }catch(error){const err=document.getElementById('jFormError');err.textContent=error.message;err.hidden=false;} return; }
    const b=e.target.closest('[data-archive]'); if(b) openForm('archive',b.dataset.archive);
  });

  form.addEventListener('submit',async e=>{

    try {
      let ok;
      if(mode==='settings') ok=await mutate('habits/prayer-settings','PUT',{region:data.region,enabled:data.enabled==='on'});
      else if(mode==='delete') ok=await mutate('habits/'+selected,'DELETE');
      else if(mode==='archive'||mode==='activate') ok=await mutate('habits/'+selected+'/'+mode,'POST');
      else { data.weekdays=fd.getAll('weekdays').map(Number); if(!data.weekdays.length)throw new Error('Kamida bitta kunni tanlang.'); ok=await mutate('habits'+(mode==='edit'?'/'+selected:''),mode==='edit'?'PUT':'POST',{...data,request_id:formRequest}); }
      if(ok)dialog.close();
    } catch(error) { err.textContent=error.message; err.hidden=false; }
  });
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!busy&&!['today','results'].includes(section))load();});
  const initialSection=new URLSearchParams(location.search).get('section');
  showSection(['prayers','habits','qaza','add','results','preferences','extras'].includes(initialSection)?initialSection:'today');
  setInterval(()=>{if(!document.hidden&&!busy&&!dialog.open&&!['today','results'].includes(section))load();},60000);
})();
</script>
<style>
  .journey-nav { background:var(--bg-elevated); }
  .journey-nav button[aria-selected="true"] { background:var(--accent); color:var(--bg); }
</style>
</body>
