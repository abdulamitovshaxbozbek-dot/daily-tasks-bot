<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vazifalarim</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F2E2B;
    --bg-elevated: #163D38;
    --bg-card: #1A4540;
    --border: #24544E;
    --text: #F2EFE6;
    --text-dim: #9FB8B3;
    --accent: #E8B04B;
    --accent-dim: #C99640;
    --success: #6FBF8C;
    --danger: #D97757;
    --radius: 18px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; }

  html {
    scroll-padding-top: env(safe-area-inset-top, 0px);
    height: 100%;
  }

  body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    max-width: 560px;
    margin: 0 auto;
    padding: 20px 18px 32px;
    min-height: 100%;
  }

  /* ---------- Header ---------- */

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .icon-btn {
    width: 44px;
    height: 44px;
    border: 1px solid var(--border);
    border-radius: 50%;
    background: var(--bg-elevated);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    font: inherit;
    font-size: 19px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .icon-btn:active { transform: scale(0.94); }

  .icon-btn.loading { animation: spin 0.8s linear infinite; }

  @keyframes spin { to { transform: rotate(360deg); } }

  .header .greeting {
    font-size: 14px;
    color: var(--text-dim);
    margin: 0 0 2px;
  }

  .header .name {
    font-size: 22px;
    font-weight: 700;
    margin: 0;
  }

  .avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #F2C874);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 17px;
    color: #1A2E1A;
    flex-shrink: 0;
  }

  /* ---------- Tabs ---------- */

  .tabs {
    display: flex;
    gap: 6px;
    background: var(--bg-elevated);
    border-radius: 14px;
    padding: 4px;
    margin-bottom: 20px;
    position: sticky;
    top: calc(env(safe-area-inset-top, 0px) + 6px);
    z-index: 10;
    box-shadow: 0 8px 22px rgba(8, 31, 28, 0.22);
  }

  .tab {
    flex: 1;
    text-align: center;
    padding: 10px 4px;
    border-radius: 10px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text-dim);
    background: transparent;
    border: none;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
    font-family: inherit;
  }

  .tab.active {
    background: var(--accent);
    color: #1A2E1A;
  }

  /* ---------- Progress hero ---------- */

  .hero {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 26px 22px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .ring-wrap {
    position: relative;
    width: 96px;
    height: 96px;
    flex-shrink: 0;
  }

  .ring-wrap svg { transform: rotate(-90deg); }

  .ring-bg {
    fill: none;
    stroke: var(--bg-elevated);
    stroke-width: 9;
  }

  .ring-fg {
    fill: none;
    stroke: var(--accent);
    stroke-width: 9;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.6s cubic-bezier(.4,0,.2,1);
  }

  .ring-label {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  .hero-info { flex: 1; min-width: 0; }

  .hero-count {
    font-size: 15px;
    color: var(--text-dim);
    margin: 0 0 6px;
  }

  .hero-count strong { color: var(--text); font-weight: 700; }

  .hero-period {
    font-size: 13px;
    color: var(--text-dim);
    margin: 0;
  }

  .comparison {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-top: 9px;
    padding: 5px 9px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 700;
    background: rgba(159,184,179,0.12);
    color: var(--text-dim);
  }

  .comparison.up { color: var(--success); background: rgba(111,191,140,0.12); }
  .comparison.down { color: var(--danger); background: rgba(217,119,87,0.12); }

  .metric-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }

  .metric-card {
    min-width: 0;
    padding: 13px 10px;
    text-align: center;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 14px;
  }

  .metric-value { display: block; font-size: 18px; font-weight: 800; }
  .metric-label { display: block; margin-top: 3px; font-size: 10.5px; color: var(--text-dim); }

  /* ---------- Section title ---------- */

  .section-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-dim);
    margin: 22px 2px 10px;
  }

  /* ---------- Task list (daily) ---------- */

  .task-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 8px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }

  .task-icon {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-top: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
  }

  .task-icon.completed { background: rgba(111,191,140,0.18); color: var(--success); }
  .task-icon.failed { background: rgba(217,119,87,0.18); color: var(--danger); }
  .task-icon.pending { background: rgba(159,184,179,0.18); color: var(--text-dim); }

  .task-body { flex: 1; min-width: 0; }

  .task-text {
    font-size: 15px;
    font-weight: 500;
    margin: 0;
    word-break: break-word;
  }

  .task-text.done { color: var(--text-dim); text-decoration: line-through; text-decoration-color: var(--border); }

  .task-reason {
    font-size: 12.5px;
    color: var(--danger);
    margin: 4px 0 0;
  }

  /* ---------- Day/month grid (weekly/monthly) ---------- */

  .grid-list { display: flex; flex-direction: column; gap: 8px; }

  .grid-row {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 13px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .grid-row .bar-wrap {
    flex: 1;
    height: 8px;
    background: var(--bg-elevated);
    border-radius: 999px;
    overflow: hidden;
  }

  .grid-row .bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
  }

  .grid-row .row-label {
    width: 84px;
    flex-shrink: 0;
    font-size: 14px;
    font-weight: 600;
  }

  .grid-row .row-pct {
    width: 42px;
    flex-shrink: 0;
    text-align: right;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--text-dim);
  }

  .grid-row.empty .row-pct,
  .grid-row.empty .row-label { color: var(--text-dim); opacity: 0.55; }

  /* ---------- Weekly chart ---------- */

  .week-chart {
    height: 232px;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    align-items: end;
    gap: 8px;
    padding: 18px 12px 12px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }

  .week-column {
    height: 100%;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
  }

  .week-column[data-day-date] { cursor: pointer; }
  .week-column[data-day-date]:active { transform: scale(0.97); }

  .week-value {
    min-height: 18px;
    margin-bottom: 6px;
    font-size: 10.5px;
    font-weight: 700;
    color: var(--text-dim);
  }

  .week-track {
    width: 100%;
    max-width: 34px;
    height: 155px;
    display: flex;
    align-items: flex-end;
    border-radius: 9px;
    background: var(--bg-elevated);
    overflow: hidden;
  }

  .week-fill {
    width: 100%;
    min-height: 3px;
    border-radius: 9px 9px 0 0;
    background: linear-gradient(180deg, #F2C874, var(--accent));
    transition: height 0.45s ease;
  }

  .week-column.empty .week-fill { background: var(--border); }
  .week-label { margin-top: 8px; font-size: 11px; font-weight: 700; color: var(--text-dim); }

  /* ---------- Monthly calendar ---------- */

  .calendar {
    padding: 14px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }

  .calendar-head,
  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }

  .calendar-head { margin-bottom: 7px; }

  .calendar-weekday {
    text-align: center;
    font-size: 10px;
    font-weight: 700;
    color: var(--text-dim);
  }

  .calendar-day {
    aspect-ratio: 1;
    min-width: 0;
    border: 0;
    border-radius: 10px;
    background: var(--bg-elevated);
    color: var(--text-dim);
    font: inherit;
    font-size: 11px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: default;
  }

  .calendar-day.has-tasks {
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .calendar-day.has-tasks:active { transform: scale(0.92); }

  .calendar-day.blank { visibility: hidden; }
  .calendar-day.low { color: #FFE9E2; background: rgba(217,119,87,0.72); }
  .calendar-day.medium { color: #2E2815; background: rgba(232,176,75,0.82); }
  .calendar-day.high { color: #102E24; background: rgba(111,191,140,0.9); }
  .calendar-day.today { outline: 2px solid var(--text); outline-offset: 2px; }

  .calendar-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 9px 14px;
    margin-top: 14px;
    font-size: 10.5px;
    color: var(--text-dim);
  }

  .legend-item { display: inline-flex; align-items: center; gap: 5px; }
  .legend-dot { width: 9px; height: 9px; border-radius: 3px; background: var(--bg-elevated); }
  .legend-dot.low { background: rgba(217,119,87,0.72); }
  .legend-dot.medium { background: rgba(232,176,75,0.82); }
  .legend-dot.high { background: rgba(111,191,140,0.9); }

  /* ---------- Insight card ---------- */

  .insight {
    background: linear-gradient(135deg, rgba(232,176,75,0.12), rgba(232,176,75,0.03));
    border: 1px solid rgba(232,176,75,0.3);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-top: 18px;
  }

  .insight-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
    margin: 0 0 6px;
  }

  .insight-text {
    font-size: 14px;
    line-height: 1.5;
    color: var(--text);
    margin: 0;
  }

  /* ---------- States ---------- */

  .state-msg {
    text-align: center;
    color: var(--text-dim);
    font-size: 14px;
    padding: 40px 20px;
  }

  .state-icon { display: block; margin-bottom: 10px; font-size: 34px; }

  .retry-btn {
    min-height: 44px;
    margin-top: 15px;
    padding: 10px 18px;
    border: 0;
    border-radius: 12px;
    background: var(--accent);
    color: #1A2E1A;
    font: inherit;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
  }

  .updated-at {
    margin: 18px 0 0;
    text-align: center;
    font-size: 10.5px;
    color: var(--text-dim);
    opacity: 0.75;
  }

  /* ---------- Day details bottom sheet ---------- */

  .sheet-overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-top: env(safe-area-inset-top, 0px);
    background: rgba(3, 16, 14, 0.62);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.2s ease, visibility 0.2s ease;
  }

  .sheet-overlay.open { opacity: 1; visibility: visible; }

  .day-sheet {
    width: min(560px, 100%);
    max-height: 82vh;
    padding: 10px 18px calc(22px + env(safe-area-inset-bottom, 0px));
    overflow-y: auto;
    overscroll-behavior: contain;
    border: 1px solid var(--border);
    border-bottom: 0;
    border-radius: 24px 24px 0 0;
    background: var(--bg-elevated);
    box-shadow: 0 -18px 50px rgba(0,0,0,0.3);
    transform: translateY(24px);
    transition: transform 0.24s cubic-bezier(.2,.8,.2,1);
  }

  .sheet-overlay.open .day-sheet { transform: translateY(0); }
  .sheet-handle { width: 42px; height: 4px; margin: 0 auto 14px; border-radius: 999px; background: var(--border); }

  .sheet-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 16px;
  }

  .sheet-title { margin: 0; font-size: 20px; font-weight: 800; }
  .sheet-subtitle { margin: 4px 0 0; color: var(--text-dim); font-size: 12.5px; }

  .sheet-close {
    width: 40px;
    height: 40px;
    flex: 0 0 auto;
    border: 0;
    border-radius: 50%;
    background: var(--bg-card);
    color: var(--text);
    font: inherit;
    font-size: 19px;
    cursor: pointer;
  }

  .sheet-summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--bg-card);
  }

  .sheet-summary strong { font-size: 18px; }
  .sheet-summary span { font-size: 12px; color: var(--text-dim); }
  body.sheet-open { overflow: hidden; }

  .skeleton {
    background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-elevated) 37%, var(--bg-card) 63%);
    background-size: 400% 100%;
    animation: shimmer 1.4s ease infinite;
    border-radius: 14px;
    height: 64px;
    margin-bottom: 8px;
  }

  @keyframes shimmer {
    0% { background-position: 100% 50%; }
    100% { background-position: 0 50%; }
  }

  @media (prefers-reduced-motion: reduce) {
    .ring-fg { transition: none; }
    .skeleton { animation: none; }
  }

  @media (max-width: 370px) {
    .app { padding-left: 12px; padding-right: 12px; }
    .hero { padding: 20px 16px; gap: 14px; }
    .ring-wrap, .ring-wrap svg { width: 84px; height: 84px; }
    .week-chart { gap: 5px; padding-left: 8px; padding-right: 8px; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div>
      <p class="greeting" id="greeting">Xush kelibsiz</p>
      <p class="name" id="userName">&nbsp;</p>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="refreshBtn" type="button" aria-label="Ma’lumotlarni yangilash">↻</button>
      <div class="avatar" id="avatarInitial">?</div>
    </div>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab active" data-period="daily" role="tab" aria-selected="true">Kunlik</button>
    <button class="tab" data-period="weekly" role="tab" aria-selected="false">Haftalik</button>
    <button class="tab" data-period="monthly" role="tab" aria-selected="false">Oylik</button>
    <button class="tab" data-period="yearly" role="tab" aria-selected="false">Yillik</button>
  </div>

  <div id="content">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </div>
</div>

<div class="sheet-overlay" id="daySheetOverlay" aria-hidden="true">
  <section class="day-sheet" id="daySheet" role="dialog" aria-modal="true" aria-labelledby="daySheetTitle">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div>
        <h2 class="sheet-title" id="daySheetTitle">Kun tafsilotlari</h2>
        <p class="sheet-subtitle" id="daySheetSubtitle"></p>
      </div>
      <button class="sheet-close" id="daySheetClose" type="button" aria-label="Yopish">✕</button>
    </div>
    <div id="daySheetContent"></div>
  </section>
</div>

<script>
(function () {
  const tg = window.Telegram && window.Telegram.WebApp;

  if (tg) {
    tg.ready();
    tg.expand();
    if (tg.setHeaderColor) { try { tg.setHeaderColor('#0F2E2B'); } catch (e) {} }
    if (tg.setBackgroundColor) { try { tg.setBackgroundColor('#0F2E2B'); } catch (e) {} }
  }

  const initData = tg ? tg.initData : '';
  const tgUser = tg && tg.initDataUnsafe ? tg.initDataUnsafe.user : null;

  const API_BASE = window.location.origin + '/api/miniapp';

  const contentEl = document.getElementById('content');
  const userNameEl = document.getElementById('userName');
  const greetingEl = document.getElementById('greeting');
  const avatarEl = document.getElementById('avatarInitial');
  const refreshBtn = document.getElementById('refreshBtn');
  const daySheetOverlay = document.getElementById('daySheetOverlay');
  const daySheetClose = document.getElementById('daySheetClose');
  const daySheetTitle = document.getElementById('daySheetTitle');
  const daySheetSubtitle = document.getElementById('daySheetSubtitle');
  const daySheetContent = document.getElementById('daySheetContent');

  const cache = {};
  let currentPeriod = 'daily';
  let lastUpdatedAt = null;

  function haptic(style) {
    if (tg && tg.HapticFeedback) {
      try { tg.HapticFeedback.impactOccurred(style || 'light'); } catch (e) {}
    }
  }

  function shortDate(iso) {
    if (!iso) return '';
    const parts = iso.split('-');
    return parts.length === 3 ? parts[2] + '.' + parts[1] + '.' + parts[0] : iso;
  }

  function updatedMarkup() {
    if (!lastUpdatedAt) return '';
    return '<p class="updated-at">Yangilandi: ' +
      String(lastUpdatedAt.getHours()).padStart(2, '0') + ':' +
      String(lastUpdatedAt.getMinutes()).padStart(2, '0') + '</p>';
  }

  function metricMarkup(completed, failed, pending) {
    return '<div class="metric-grid">' +
      '<div class="metric-card"><span class="metric-value">' + completed + '</span><span class="metric-label">Bajarildi</span></div>' +
      '<div class="metric-card"><span class="metric-value">' + failed + '</span><span class="metric-label">Bajarilmadi</span></div>' +
      '<div class="metric-card"><span class="metric-value">' + pending + '</span><span class="metric-label">Kutilmoqda</span></div>' +
    '</div>';
  }

  function comparisonMarkup(current, previous) {
    if (!previous || !previous.total) return '<span class="comparison">Kecha ma’lumot yo‘q</span>';
    const difference = current.percent - previous.percent;
    if (difference > 0) return '<span class="comparison up">↑ Kechagidan ' + difference + '% yaxshi</span>';
    if (difference < 0) return '<span class="comparison down">↓ Kechagidan ' + Math.abs(difference) + '% past</span>';
    return '<span class="comparison">＝ Kechagi natija bilan teng</span>';
  }

  function greetingForHour() {
    const h = new Date().getHours();
    if (h < 12) return 'Xayrli tong';
    if (h < 18) return 'Assalomu alaykum';
    return 'Xayrli kech';
  }

  function setHeaderName(name) {
    userNameEl.textContent = name || 'Foydalanuvchi';
    avatarEl.textContent = (name || '?').trim().charAt(0).toUpperCase();
    greetingEl.textContent = greetingForHour();
  }

  if (tgUser && tgUser.first_name) {
    setHeaderName(tgUser.first_name);
  }

  function apiFetch(path) {
    const url = API_BASE + path + (path.includes('?') ? '&' : '?') +
      'initData=' + encodeURIComponent(initData || '');
    return fetch(url).then(function (res) {
      if (!res.ok) {
        return res.json().catch(function () { return {}; }).then(function (body) {
          throw new Error(body.detail || ('Xatolik: ' + res.status));
        });
      }
      return res.json();
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  function ringMarkup(percent) {
    const r = 40;
    const c = 2 * Math.PI * r;
    const offset = c - (Math.max(0, Math.min(100, percent)) / 100) * c;
    return (
      '<div class="ring-wrap">' +
        '<svg width="96" height="96" viewBox="0 0 96 96">' +
          '<circle class="ring-bg" cx="48" cy="48" r="' + r + '"></circle>' +
          '<circle class="ring-fg" cx="48" cy="48" r="' + r + '" ' +
            'stroke-dasharray="' + c.toFixed(1) + '" ' +
            'stroke-dashoffset="' + offset.toFixed(1) + '"></circle>' +
        '</svg>' +
        '<div class="ring-label">' + percent + '%</div>' +
      '</div>'
    );
  }

  function insightMarkup(topReason, motivation) {
    let html = '';
    if (motivation && motivation.title) {
      html += (
        '<div class="insight">' +
          '<p class="insight-title">' + escapeHtml(motivation.title) + '</p>' +
          '<p class="insight-text">' + escapeHtml(motivation.text) + '</p>' +
        '</div>'
      );
    }
    if (topReason && topReason.display) {
      html += (
        '<div class="insight" style="margin-top:10px;">' +
          '<p class="insight-title">🔍 Eng ko‘p uchragan sabab</p>' +
          '<p class="insight-text">' + escapeHtml(topReason.display) +
            ' — ' + topReason.count + ' marta</p>' +
        '</div>'
      );
    }
    return html;
  }

  function renderDaily(data) {
    const s = data.stats;
    let html = '<div class="hero">' +
      ringMarkup(s.percent) +
      '<div class="hero-info">' +
        '<p class="hero-count"><strong>' + s.completed + '</strong> / ' + s.total + ' vazifa bajarildi</p>' +
        '<p class="hero-period">' + escapeHtml(shortDate(data.date)) + '</p>' +
        comparisonMarkup(s, data.yesterday && data.yesterday.stats) +
      '</div>' +
    '</div>';

    html += metricMarkup(s.completed, s.failed || 0, s.pending || 0);

    html += '<p class="section-title">VAZIFALAR</p>';

    if (!data.tasks.length) {
      html += '<div class="state-msg"><span class="state-icon">📝</span>Bugun uchun vazifalar hali qo‘shilmagan</div>';
    } else {
      data.tasks.forEach(function (t) {
        const iconClass = t.status === 'completed' ? 'completed' : (t.status === 'failed' ? 'failed' : 'pending');
        const icon = t.status === 'completed' ? '✓' : (t.status === 'failed' ? '✕' : '⏳');
        html += (
          '<div class="task-card">' +
            '<div class="task-icon ' + iconClass + '">' + icon + '</div>' +
            '<div class="task-body">' +
              '<p class="task-text' + (t.status === 'completed' ? ' done' : '') + '">' + escapeHtml(t.task_text) + '</p>' +
              (t.status === 'failed' ? '<p class="task-reason">' + escapeHtml(t.fail_reason_display || 'sababi yozilmadi') + '</p>' : '') +
            '</div>' +
          '</div>'
        );
      });
    }

    html += insightMarkup(data.top_fail_reason, data.motivation) + updatedMarkup();
    contentEl.innerHTML = html;
  }

  function renderWeekly(data) {
    const s = data.stats;
    let html = '<div class="hero">' +
      ringMarkup(s.percent) +
      '<div class="hero-info">' +
        '<p class="hero-count"><strong>' + s.completed + '</strong> / ' + s.total + ' vazifa bajarildi</p>' +
        '<p class="hero-period">' + escapeHtml(shortDate(data.start_date)) + ' — ' + escapeHtml(shortDate(data.end_date)) + '</p>' +
      '</div>' +
    '</div>';

    html += metricMarkup(s.completed, s.failed || 0, s.pending || 0);
    html += '<p class="section-title">HAFTA KUNLARI</p><div class="week-chart">';
    data.days.forEach(function (d) {
      const empty = d.total === 0;
      html += (
        '<div class="week-column' + (empty ? ' empty' : '') + '"' +
          (empty ? '' : ' data-day-date="' + escapeHtml(d.date) + '" role="button" tabindex="0"') +
          ' title="' + escapeHtml(d.name) + ': ' + (empty ? 'ma’lumot yo‘q' : d.completed + '/' + d.total) + '">' +
          '<div class="week-value">' + (empty ? '—' : d.percent + '%') + '</div>' +
          '<div class="week-track"><div class="week-fill" style="height:' + (empty ? 0 : d.percent) + '%"></div></div>' +
          '<div class="week-label">' + escapeHtml(d.name.slice(0, 2)) + '</div>' +
        '</div>'
      );
    });
    html += '</div>';

    html += insightMarkup(data.top_fail_reason, data.motivation) + updatedMarkup();
    contentEl.innerHTML = html;
  }

  function renderMonthly(data) {
    const s = data.stats;
    let html = '<div class="hero">' +
      ringMarkup(s.percent) +
      '<div class="hero-info">' +
        '<p class="hero-count"><strong>' + s.completed + '</strong> / ' + s.total + ' vazifa bajarildi</p>' +
        '<p class="hero-period">' + escapeHtml(shortDate(data.start_date)) + ' — ' + escapeHtml(shortDate(data.end_date)) + '</p>' +
      '</div>' +
    '</div>';

    html += metricMarkup(s.completed, s.failed || 0, s.pending || 0);
    html += '<p class="section-title">OYLIK FAOLLIK</p>' + calendarMarkup(data);

    html += insightMarkup(data.top_fail_reason, data.motivation) + updatedMarkup();
    contentEl.innerHTML = html;
  }

  function calendarMarkup(data) {
    const start = new Date(data.start_date + 'T00:00:00');
    const year = start.getFullYear();
    const month = start.getMonth();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const mondayOffset = (start.getDay() + 6) % 7;
    const byDay = {};
    data.days.forEach(function (d) { byDay[Number(d.date.slice(-2))] = d; });

    let html = '<div class="calendar"><div class="calendar-head">';
    ['Du', 'Se', 'Cho', 'Pa', 'Ju', 'Sha', 'Ya'].forEach(function (name) {
      html += '<div class="calendar-weekday">' + name + '</div>';
    });
    html += '</div><div class="calendar-grid">';

    for (let i = 0; i < mondayOffset; i++) html += '<div class="calendar-day blank"></div>';
    for (let day = 1; day <= daysInMonth; day++) {
      const d = byDay[day];
      let level = '';
      if (d) level = d.percent >= 80 ? ' high' : (d.percent >= 50 ? ' medium' : ' low');
      const iso = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
      const isToday = iso === data.end_date;
      const title = d ? (d.completed + '/' + d.total + ' — ' + d.percent + '%') : 'Vazifa yo‘q';
      html += '<div class="calendar-day' + level + (d ? ' has-tasks' : '') + (isToday ? ' today' : '') + '"' +
        (d ? ' data-day-date="' + iso + '" role="button" tabindex="0"' : '') +
        ' title="' + title + '">' + day + '</div>';
    }

    html += '</div><div class="calendar-legend">' +
      '<span class="legend-item"><i class="legend-dot"></i>Vazifa yo‘q</span>' +
      '<span class="legend-item"><i class="legend-dot low"></i>1–49%</span>' +
      '<span class="legend-item"><i class="legend-dot medium"></i>50–79%</span>' +
      '<span class="legend-item"><i class="legend-dot high"></i>80–100%</span>' +
    '</div></div>';
    return html;
  }

  function renderYearly(data) {
    const s = data.stats;
    let html = '<div class="hero">' +
      ringMarkup(s.percent) +
      '<div class="hero-info">' +
        '<p class="hero-count"><strong>' + s.completed + '</strong> / ' + s.total + ' vazifa bajarildi</p>' +
        '<p class="hero-period">' + data.year + '-yil</p>' +
      '</div>' +
    '</div>';

    html += metricMarkup(s.completed, s.failed || 0, s.pending || 0);
    html += '<p class="section-title">OYLAR BO‘YICHA</p><div class="grid-list">';
    if (!data.months.length) {
      html += '<div class="state-msg"><span class="state-icon">📊</span>Bu yil uchun ma’lumot yo‘q</div>';
    } else {
      data.months.forEach(function (m) {
        html += (
          '<div class="grid-row">' +
            '<div class="row-label">' + escapeHtml(m.month_name) + '</div>' +
            '<div class="bar-wrap"><div class="bar-fill" style="width:' + m.percent + '%"></div></div>' +
            '<div class="row-pct">' + m.percent + '%</div>' +
          '</div>'
        );
      });
    }
    html += '</div>';

    html += insightMarkup(data.top_fail_reason, data.motivation) + updatedMarkup();
    contentEl.innerHTML = html;
  }

  const renderers = {
    daily: renderDaily,
    weekly: renderWeekly,
    monthly: renderMonthly,
    yearly: renderYearly
  };

  function showSkeleton() {
    contentEl.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
  }

  function showError(message) {
    contentEl.innerHTML = '<div class="state-msg"><span class="state-icon">⚠️</span>' +
      escapeHtml(message) + '<br><button class="retry-btn" id="retryBtn" type="button">Qayta urinish</button></div>';
    const retryBtn = document.getElementById('retryBtn');
    if (retryBtn) retryBtn.addEventListener('click', function () { loadPeriod(currentPeriod, true); });
  }

  function openDaySheet(selectedDate) {
    haptic('light');
    daySheetTitle.textContent = shortDate(selectedDate);
    daySheetSubtitle.textContent = 'Vazifalar yuklanmoqda…';
    daySheetContent.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>';
    daySheetOverlay.classList.add('open');
    daySheetOverlay.setAttribute('aria-hidden', 'false');
    document.body.classList.add('sheet-open');

    apiFetch('/day?date=' + encodeURIComponent(selectedDate))
      .then(function (data) {
        renderDaySheet(data);
      })
      .catch(function (err) {
        daySheetSubtitle.textContent = '';
        daySheetContent.innerHTML = '<div class="state-msg"><span class="state-icon">⚠️</span>' +
          escapeHtml(err.message || 'Vazifalarni yuklab bo‘lmadi') + '</div>';
      });
  }

  function renderDaySheet(data) {
    const s = data.stats;
    daySheetTitle.textContent = shortDate(data.date);
    daySheetSubtitle.textContent = s.total ? (s.completed + ' / ' + s.total + ' vazifa bajarildi') : 'Vazifa yo‘q';

    let html = '<div class="sheet-summary"><div><strong>' + s.percent + '%</strong><br><span>Kun natijasi</span></div>' +
      '<span>' + s.completed + ' bajarildi · ' + s.failed + ' bajarilmadi · ' + s.pending + ' kutilmoqda</span></div>';

    if (!data.tasks.length) {
      html += '<div class="state-msg"><span class="state-icon">📝</span>Bu kunda vazifalar bo‘lmagan</div>';
    } else {
      data.tasks.forEach(function (t) {
        const iconClass = t.status === 'completed' ? 'completed' : (t.status === 'failed' ? 'failed' : 'pending');
        const icon = t.status === 'completed' ? '✓' : (t.status === 'failed' ? '✕' : '⏳');
        html += '<div class="task-card">' +
          '<div class="task-icon ' + iconClass + '">' + icon + '</div>' +
          '<div class="task-body"><p class="task-text' + (t.status === 'completed' ? ' done' : '') + '">' + escapeHtml(t.task_text) + '</p>' +
          (t.status === 'failed' ? '<p class="task-reason">Sabab: ' + escapeHtml(t.fail_reason_display || 'yozilmagan') + '</p>' : '') +
          '</div></div>';
      });
    }

    daySheetContent.innerHTML = html;
  }

  function closeDaySheet() {
    daySheetOverlay.classList.remove('open');
    daySheetOverlay.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('sheet-open');
  }

  daySheetClose.addEventListener('click', closeDaySheet);
  daySheetOverlay.addEventListener('click', function (event) {
    if (event.target === daySheetOverlay) closeDaySheet();
  });

  contentEl.addEventListener('click', function (event) {
    const target = event.target.closest('[data-day-date]');
    if (target) openDaySheet(target.dataset.dayDate);
  });

  contentEl.addEventListener('keydown', function (event) {
    const target = event.target.closest('[data-day-date]');
    if (target && (event.key === 'Enter' || event.key === ' ')) {
      event.preventDefault();
      openDaySheet(target.dataset.dayDate);
    }
  });

  function loadPeriod(period, force) {
    currentPeriod = period;

    if (!force && cache[period]) {
      renderers[period](cache[period]);
      return;
    }

    refreshBtn.classList.add('loading');
    showSkeleton();

    apiFetch('/' + period)
      .then(function (data) {
        cache[period] = data;
        lastUpdatedAt = new Date();
        refreshBtn.classList.remove('loading');
        if (currentPeriod === period) {
          renderers[period](data);
        }
      })
      .catch(function (err) {
        refreshBtn.classList.remove('loading');
        if (currentPeriod === period) {
          showError(err.message || 'Ma\'lumotni yuklab bo\'lmadi');
        }
      });
  }

  document.querySelectorAll('.tab').forEach(function (btn) {
    btn.addEventListener('click', function () {
      haptic('light');
      document.querySelectorAll('.tab').forEach(function (b) {
        b.classList.remove('active');
        b.setAttribute('aria-selected', 'false');
      });
      btn.classList.add('active');
      btn.setAttribute('aria-selected', 'true');
      loadPeriod(btn.dataset.period);
    });
  });

  refreshBtn.addEventListener('click', function () {
    haptic('medium');
    delete cache[currentPeriod];
    loadPeriod(currentPeriod, true);
  });

  apiFetch('/me')
    .then(function (data) {
      setHeaderName(data.first_name);
    })
    .catch(function () {
      /* profil olinmasa ham dashboard davom etadi */
    });

  loadPeriod('daily');
})();
</script>

</body>
</html>
