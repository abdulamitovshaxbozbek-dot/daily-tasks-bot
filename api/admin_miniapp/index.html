<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qadam · Admin</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F2E2B;
    --bg-elevated: #163D38;
    --bg-card: #1A4540;
    --border: #24544E;
    --text: #F2EFE6;
    --text-dim: #9FB8B3;
    --accent: #E8B04B;
    --success: #6FBF8C;
    --danger: #D97757;
    --radius: 18px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .app {
    max-width: 560px;
    margin: 0 auto;
    padding: 18px 16px calc(96px + env(safe-area-inset-bottom, 0px));
    min-height: 100%;
  }
  .header { margin-bottom: 18px; }
  .header h1 { font-size: 20px; font-weight: 800; margin: 0 0 2px; }
  .header p { font-size: 12.5px; color: var(--text-dim); margin: 0; }

  .kpi-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 16px;
  }
  .kpi-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    min-width: 0;
  }
  .kpi-value { font-size: 22px; font-weight: 800; display: block; word-break: break-word; }
  .kpi-label { font-size: 11px; color: var(--text-dim); margin-top: 3px; display: block; }
  .kpi-sub { font-size: 10.5px; color: var(--text-dim); margin-top: 6px; opacity: 0.8; }

  .section-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-dim);
    margin: 20px 2px 10px;
  }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
  }

  .chart-bars {
    display: flex;
    align-items: flex-end;
    gap: 6px;
    height: 120px;
    margin-top: 4px;
  }
  .chart-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .chart-track { width: 100%; max-width: 22px; height: 90px; display: flex; align-items: flex-end; border-radius: 6px; background: var(--bg-elevated); overflow: hidden; }
  .chart-fill { width: 100%; min-height: 0; background: linear-gradient(180deg, #F2C874, var(--accent)); border-radius: 6px 6px 0 0; }
  .chart-fill.secondary { background: linear-gradient(180deg, #8FD1A8, var(--success)); }
  .chart-label { font-size: 9.5px; color: var(--text-dim); margin-top: 5px; }
  .legend { display: flex; gap: 14px; margin-top: 10px; font-size: 11px; color: var(--text-dim); }
  .legend-dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 5px; }

  .funnel-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .funnel-row:last-child { border-bottom: none; }
  .funnel-bar-wrap { flex: 1; height: 26px; background: var(--bg-elevated); border-radius: 8px; overflow: hidden; position: relative; }
  .funnel-bar { height: 100%; background: var(--accent); border-radius: 8px; }
  .funnel-label { position: absolute; inset: 0; display: flex; align-items: center; padding-left: 10px; font-size: 11.5px; font-weight: 600; color: #1A2E1A; }
  .funnel-count { width: 56px; flex-shrink: 0; text-align: right; font-size: 13px; font-weight: 700; }
  .funnel-pct { width: 40px; flex-shrink: 0; text-align: right; font-size: 10.5px; color: var(--text-dim); }

  .task-split { display: flex; gap: 8px; margin-top: 10px; }
  .task-split-item { flex: 1; text-align: center; padding: 10px 6px; border-radius: 12px; background: var(--bg-elevated); }
  .task-split-value { font-size: 17px; font-weight: 800; }
  .task-split-label { font-size: 10px; color: var(--text-dim); margin-top: 2px; }

  .retention-headline { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
  .retention-headline .kpi-card { text-align: center; padding: 12px 6px; }

  table.cohort { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  table.cohort th, table.cohort td { padding: 8px 4px; text-align: center; border-bottom: 1px solid var(--border); }
  table.cohort th { color: var(--text-dim); font-weight: 700; font-size: 10px; }
  table.cohort td:first-child, table.cohort th:first-child { text-align: left; }
  .cohort-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }

  .segment-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .segment-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; }
  .segment-row .seg-name { font-size: 13.5px; font-weight: 600; }
  .segment-row .seg-count { font-size: 15px; font-weight: 800; }

  .search-box {
    width: 100%;
    padding: 11px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    color: var(--text);
    font: inherit;
    font-size: 14px;
    margin-bottom: 12px;
  }
  .search-box::placeholder { color: var(--text-dim); }

  .user-row { padding: 12px 14px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 8px; }
  .user-row-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .user-name { font-size: 14px; font-weight: 700; }
  .user-username { font-size: 11.5px; color: var(--text-dim); }
  .user-meta { display: flex; gap: 12px; margin-top: 6px; font-size: 11px; color: var(--text-dim); flex-wrap: wrap; }

  .pagination { display: flex; justify-content: center; align-items: center; gap: 14px; margin-top: 10px; }
  .page-btn { min-width: 40px; min-height: 40px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-elevated); color: var(--text); font: inherit; cursor: pointer; }
  .page-btn:disabled { opacity: 0.3; }

  .state-msg { text-align: center; color: var(--text-dim); font-size: 14px; padding: 40px 20px; }
  .state-icon { display: block; margin-bottom: 10px; font-size: 34px; }
  .skeleton { background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-elevated) 37%, var(--bg-card) 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; border-radius: 14px; height: 64px; margin-bottom: 8px; }
  @keyframes shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }

  .bottom-nav {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    padding: 8px 12px calc(10px + env(safe-area-inset-bottom, 0px));
    background: var(--bg-elevated);
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-around;
    z-index: 20;
  }
  .nav-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 6px 4px;
    background: none;
    border: none;
    color: var(--text-dim);
    font: inherit;
    font-size: 10.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .nav-btn .nav-icon { font-size: 19px; }
  .nav-btn.active { color: var(--accent); }

  @media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } }

  .metric-note { font-size: 12px; line-height: 1.6; color: var(--text-dim); margin: 12px 0; }
  .metric-row { display: grid; grid-template-columns: minmax(0,1fr) 32px 52px; gap: 10px; align-items: center; margin: 18px 0; font-size: 12px; }
  .metric-track { height: 5px; background: var(--bg-elevated); margin-top: 8px; border-radius: 5px; }
  .metric-track i { display: block; height: 100%; background: var(--success); border-radius: 5px; }
  .reason-card { overflow-wrap: anywhere; }
  .reason-card p { font-size: 13px; line-height: 1.6; }
  .reason-text { white-space: pre-wrap; color: var(--text-dim); }
  .refresh-admin { font: inherit; color: var(--accent); background: var(--bg-card); border: 1px solid var(--border); padding: 9px 14px; border-radius: 12px; margin-top: 10px; }
  .refresh-admin:disabled { opacity: .5; }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <h1 id="pageTitle">Overview</h1>
    <p id="pageSubtitle">Qadam admin dashboard</p>
    <button id="adminRefresh" class="refresh-admin" type="button" disabled>↻ Yangilash</button>
  </div>
  <div id="content">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </div>
</div>

<nav class="bottom-nav">
  <button class="nav-btn active" data-tab="overview" type="button">
    <span class="nav-icon">🏠</span>Umumiy
  </button>
  <button class="nav-btn" data-tab="activity" type="button">
    <span class="nav-icon">⚡</span>Faollik
  </button>
  <button class="nav-btn" data-tab="retention" type="button">
    <span class="nav-icon">🔁</span>Retention
  </button>
  <button class="nav-btn" data-tab="users" type="button">
    <span class="nav-icon">👥</span>Userlar
  </button>
</nav>

<script>
(function () {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    if (tg.setHeaderColor) { try { tg.setHeaderColor('#0F2E2B'); } catch (e) {} }
    if (tg.setBackgroundColor) { try { tg.setBackgroundColor('#0F2E2B'); } catch (e) {} }
  }

  const initData = tg ? tg.initData : '';
  const API_BASE = window.location.origin + '/api/admin';
  const contentEl = document.getElementById('content');
  const titleEl = document.getElementById('pageTitle');
  const subtitleEl = document.getElementById('pageSubtitle');

  const titles = {
    overview: ['Umumiy', "Bugungi umumiy ko'rsatkichlar"],
    activity: ['Faollik', 'Bugungi rejalar va bajarilish holati'],
    retention: ['Retention', 'D1 / D3 / D7 / D30 saqlanish'],
    users: ['Foydalanuvchilar', 'Segmentlar va foydalanuvchi ro\u2018yxati']
  };

  let currentTab = 'overview';
  let usersPage = 1;
  let usersSearch = '';
  let searchDebounce = null;
  let isAdminVerified = false;
  let loadVersion = 0;

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function haptic(style) {
    if (tg && tg.HapticFeedback) {
      try { tg.HapticFeedback.impactOccurred(style || 'light'); } catch (e) {}
    }
  }

  function apiFetch(path) {
    const url = API_BASE + path + (path.includes('?') ? '&' : '?') +
      'initData=' + encodeURIComponent(initData || '');
    return fetch(url, {cache: 'no-store'}).then(function (res) {
      if (!res.ok) {
        return res.json().catch(function () { return {}; }).then(function (body) {
          const err = new Error(typeof body.detail === 'string' ? body.detail : ('Xatolik: ' + res.status));
          err.status = res.status;
          throw err;
        });
      }
      return res.json();
    });
  }

  function showSkeleton() {
    contentEl.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
  }

  function showError(message, isForbidden) {
    contentEl.innerHTML = '<div class="state-msg"><span class="state-icon">' +
      (isForbidden ? '⛔' : '⚠️') + '</span>' + escapeHtml(message) + '</div>';
  }

  function shortDate(iso) {
    if (!iso) return '';
    const parts = iso.split('-');
    return parts.length === 3 ? parts[2] + '.' + parts[1] + '.' + parts[0] : iso;
  }

  // Barcha raqamlar server hisobidan olinadi; noma'lum qiymat 0 deb ko'rsatilmaydi.
  function number(value) { return value === null || value === undefined ? '—' : String(value); }
  function pct(value) { return value === null || value === undefined ? '—' : value + '%'; }
  function note(text) { return '<p class="metric-note">' + escapeHtml(text || '') + '</p>'; }
  function kpi(value, label, sub) {
    return '<div class="kpi-card"><span class="kpi-value">' + number(value) + '</span><span class="kpi-label">' + escapeHtml(label) + '</span>' +
      (sub ? '<div class="kpi-sub">' + escapeHtml(sub) + '</div>' : '') + '</div>';
  }
  function dataNotes(data) {
    const stamp = data.generated_at ? new Intl.DateTimeFormat('en-GB', {
      timeZone: 'Asia/Tashkent', dateStyle: 'short', timeStyle: 'medium'
    }).format(new Date(data.generated_at)) : '—';
    return note('Hisob sanasi: ' + shortDate(data.date) + ' · Toshkent vaqti. Yangilangan: ' + stamp) +
      note(data.scope_note) + note(data.task_note) + (data.signup_date_note ? note(data.signup_date_note) : '');
  }

  // ---------- Overview ----------

  function renderOverview(overview, trends) {
    const u = overview.users, t = overview.tasks;
    let html = '<div class="kpi-grid">' +
      kpi(u.total, 'Joriy bot foydalanuvchilari', 'Bloklanganlar ham jami ichida: ' + u.blocked) +
      kpi(u.today_new, 'Bugun bazaga qo‘shilgan', 'Kecha: ' + number(u.yesterday_new)) +
      kpi(u.today_active, 'Bugun botda faol', 'Bugun bilan oxirgi 7 kun: ' + u.week_active) +
      kpi(t.today_users_with_tasks, 'Bugunga vazifasi bor', 'Bugungi mavjud vazifalar: ' + t.today_total) +
      kpi(u.week_new, 'Oxirgi 7 kunda qo‘shilgan', 'Bugun va oldingi 6 kun') +
      kpi(u.all_marked_users, 'Bugungi barcha vazifasi belgilangan', 'Bajarilgan yoki bajarilmagan deb belgilangan') +
      kpi(u.all_completed_users, 'Bugungi barcha vazifasi bajarilgan', 'Kamida bitta vazifa bo‘lishi shart') +
      kpi(t.tomorrow_total, 'Ertangi vazifalar', t.tomorrow_users_with_tasks + ' foydalanuvchida') +
      kpi(t.pending_date_choices, 'Sana tanlanmagan so‘rovlar', 'Barcha sanalardagi kutilayotgan yozuvlar') + '</div>';
    html += note('Vazifa sanasi uning yozilgan sanasi emas: kecha ertagaga yozilgan vazifa bugungi rejaga kiradi. Barcha vazifalar belgilanishi kunni yopmaydi.');
    html += '<p class="section-title">OXIRGI ' + trends.days.length + ' KUN</p><div class="card">' + trendsChartMarkup(trends) + '</div>';
    html += dataNotes(overview);
    contentEl.innerHTML = html;
  }

  function trendsChartMarkup(trends) {
    const days = trends.days;
    const maxVal = Math.max(1, ...days.map(function (d) { return Math.max(d.new_users, d.active_users); }));

    let html = '<div class="chart-bars">';
    days.forEach(function (d) {
      const newH = Math.round((d.new_users / maxVal) * 100);
      const activeH = Math.round((d.active_users / maxVal) * 100);
      html += '<div class="chart-col" title="' + escapeHtml(d.date) + ': +' + d.new_users + ' yangi, ' + d.active_users + ' faol">' +
        '<div style="display:flex;gap:2px;align-items:flex-end;height:90px;width:100%;justify-content:center;">' +
          '<div class="chart-track" style="max-width:10px;"><div class="chart-fill" style="height:' + newH + '%"></div></div>' +
          '<div class="chart-track" style="max-width:10px;"><div class="chart-fill secondary" style="height:' + activeH + '%"></div></div>' +
        '</div>' +
        '<div class="chart-label">' + shortDate(d.date).slice(0, 5) + '</div>' +
      '</div>';
    });
    html += '</div>';
    html += '<div class="legend">' +
      '<span><i class="legend-dot" style="background:var(--accent)"></i>Yangi userlar</span>' +
      '<span><i class="legend-dot" style="background:var(--success)"></i>Faol userlar</span>' +
    '</div>';
    return html;
  }

  function loadOverview() {
    const request = ++loadVersion;
    showSkeleton();
    apiFetch('/overview').then(function (data) {
      if (currentTab !== 'overview' || request !== loadVersion) return;
      renderOverview(data, data.trends);
    }).catch(function (err) { if (request === loadVersion) handleLoadError(err); });
  }

  // ---------- Activity ----------

  function renderActivity(data) {
    let html = '<div class="card"><p class="section-title">BUGUNGI FOYDALANUVCHI GURUHLARI</p>' +
      note('Guruhlar mustaqil va ustma-ust kelishi mumkin. Foiz har doim jami ' + data.total_users + ' foydalanuvchiga nisbatan. Bu funnel emas.');
    data.metrics.forEach(function (step) {
      html += '<div class="metric-row"><div><span>' + escapeHtml(step.label) + '</span><div class="metric-track"><i style="width:' +
        Math.max(0, Math.min(100, step.percent_of_total || 0)) + '%"></i></div></div><strong>' + step.count + '</strong><span>' + pct(step.percent_of_total) + '</span></div>';
    });
    html += '</div><p class="section-title">BUGUNGI VAZIFALAR</p><div class="kpi-grid">' +
      kpi(data.tasks.completed, 'Bajarilgan', pct(data.tasks.completed_percent)) +
      kpi(data.tasks.failed, 'Bajarilmagan deb belgilangan', pct(data.tasks.failed_percent)) +
      kpi(data.tasks.pending, 'Hali belgilanmagan', pct(data.tasks.pending_percent)) +
      kpi(data.tasks.total, 'Bugungi jami vazifa') + '</div>';
    if (data.tasks.unknown) html += note('Noma’lum statusdagi vazifalar: ' + data.tasks.unknown + '. Ular jami hisobda bor, pending yoki failed deb taxmin qilinmadi.');
    html += note('Foizlar jami bugungi vazifalarga nisbatan; yaxlitlash sabab yig‘indi 100% dan ozgina farq qilishi mumkin.');
    html += '<p class="section-title">BAJARILMAGANLIK SABABLARI</p><div class="card">';
    if (!data.reasons.length) html += note('Bugunga bajarilmagan deb belgilangan vazifa yo‘q.');
    data.reasons.forEach(function (r) { html += segmentRow(escapeHtml(r.label), r.count); });
    html += note('Sababi hali saqlanmagan: ' + data.tasks.missing_reason + '. “Boshqa” yozma sababi bor: ' + data.tasks.custom_reason +
      '. “Boshqa” tanlangan, ammo yozma matni yo‘q: ' + data.tasks.other_without_text + '.') + '</div>';
    if (data.custom_reasons.length) {
      html += '<p class="section-title">“BOSHQA” — YOZILGAN SABABLAR</p>' + note('Bugungi ' + data.tasks.custom_reason + ' yozma sababdan ' + data.custom_reasons.length +
        ' tasi. Eng yangi yaratilgan vazifalar bo‘yicha; sabab yozilgan vaqt bazada alohida saqlanmaydi.');
      data.custom_reasons.forEach(function (r) {
        html += '<div class="card reason-card"><strong>' + escapeHtml(r.first_name || 'Noma’lum') + '</strong><p>' + escapeHtml(r.task_text) +
          '</p><p class="reason-text">' + escapeHtml(r.reason) + '</p></div>';
      });
    }
    contentEl.innerHTML = html + dataNotes(data);
  }

  function loadActivity() {
    const request = ++loadVersion;
    showSkeleton();
    apiFetch('/activity').then(function (data) {
      if (currentTab !== 'activity' || request !== loadVersion) return;
      renderActivity(data);
    }).catch(function (err) { if (request === loadVersion) handleLoadError(err); });
  }

  // ---------- Retention ----------

  function retentionCell(value) {
    return value === null || value === undefined ? '—' : value + '%';
  }

  function renderRetention(data) {
    let html = '<div class="retention-headline">';
    ['d1','d3','d7','d30'].forEach(function (key) {
      const c = data.headline_counts[key];
      html += kpi(pct(data.headline[key]), key.toUpperCase(), c.retained + ' / ' + c.eligible + ' user');
    });
    html += '</div>' + note(data.retention_note) + note('Hisob oynasi: oxirgi ' + data.window_days + ' kun ichida bazaga qo‘shilgan guruhlar.') +
      note('Faollik jadvalidagi eng eski yozuv: ' + (data.tracking_start ? shortDate(data.tracking_start) : 'yo‘q') +
        '. Shu kun va undan oldingi guruhlar, shuningdek hali tugamagan D-kunlar “—” bilan ko‘rsatiladi. “—” 0% degani emas.');
    if (!data.cohorts.length) html += note('Bu davr uchun hisoblashga yaroqli ro‘yxatdan o‘tish ma’lumoti yo‘q.');
    else {
      html += '<div class="card cohort-scroll"><table class="cohort"><thead><tr><th>Qo‘shilgan sana</th><th>User</th><th>D1</th><th>D3</th><th>D7</th><th>D30</th></tr></thead><tbody>';
      data.cohorts.forEach(function (r) {
        html += '<tr><td>' + shortDate(r.cohort_date) + '</td><td>' + r.new_users + '</td>' +
          ['d1','d3','d7','d30'].map(function (key) { return '<td>' + pct(r[key]) + '</td>'; }).join('') + '</tr>';
      });
      html += '</tbody></table></div>';
    }
    contentEl.innerHTML = html + dataNotes(data);
  }

  function loadRetention() {
    const request = ++loadVersion;
    showSkeleton();
    apiFetch('/retention?cohorts=60').then(function (data) {
      if (currentTab !== 'retention' || request !== loadVersion) return;
      renderRetention(data);
    }).catch(function (err) { if (request === loadVersion) handleLoadError(err); });
  }

  // ---------- Users ----------

  function renderUsers(data) {
    usersPage = data.page;
    const previousSearch = document.getElementById('userSearch');
    const restoreSearch = previousSearch && document.activeElement === previousSearch;
    const selection = restoreSearch ? previousSearch.selectionStart : null;
    const s = data.segments;

    let html = '<div class="segment-list">' +
      segmentRow('🔥 Bugun faol (bloklanmagan)', s.active_today) +
      segmentRow('🟢 Oxirgi faollik 1–2 kun oldin', s.active_2d) +
      segmentRow('🟡 Oxirgi faollik 3–7 kun oldin', s.inactive_3_7) +
      segmentRow('🟠 Oxirgi faollik 8–30 kun oldin', s.inactive_8_30) +
      segmentRow('🔴 Oxirgi faollik 30 kundan oldin', s.inactive_30_plus) +
      segmentRow('⚪ Faollik qaydi yo‘q', s.never_active) +
      segmentRow('🚫 Bloklangan', s.blocked) +
    '</div>';

    html += note('Segmentlar ustma-ust tushmaydi; yig‘indisi jami ' + s.total + ' user. Qidiruv segmentlarni emas, pastdagi ro‘yxatni filtrlaydi.') + note('Qidiruv natijasi: ' + data.total + ' user.');
    html += '<input type="text" class="search-box" id="userSearch" placeholder="Ism, username yoki Telegram ID bo\u2018yicha qidirish" value="' + escapeHtml(usersSearch) + '">';

    html += '<div id="userList">';

    if (!data.users.length) {
      html += '<div class="state-msg"><span class="state-icon">🔍</span>Hech kim topilmadi</div>';
    } else {
      data.users.forEach(function (u) {
        html += '<div class="user-row">' +
          '<div class="user-row-top">' +
            '<span class="user-name">' + escapeHtml(u.first_name || 'Noma\u2018lum') + '</span>' +
            '<span class="user-username">' + (u.username ? '@' + escapeHtml(u.username) : '') + '</span>' +
          '</div>' +
          '<div class="user-meta">' +
            '<span>Qo\u2018shilgan: ' + escapeHtml(shortDate(u.joined_at) || '—') + '</span>' +
            '<span>So\u2018nggi faollik: ' + (u.last_active_date ? escapeHtml(shortDate(u.last_active_date)) : '—') + '</span>' +
            '<span>Bugungacha: ' + u.completed_tasks + ' bajarilgan / ' + u.total_tasks + ' mavjud vazifa</span>' +
            '<span>Kelajak sanalarga: ' + u.future_tasks + ' vazifa</span>' +
            '<span>Holat: ' + escapeHtml(({active:'Faol akkaunt',blocked:'Bloklangan',waiting_morning_time:'Ertalabki vaqt tanlanmagan',completed:'Eski completed holati'})[u.state] || u.state || 'Noma’lum') + '</span>' +
            '<span>Ertalabki vaqt: ' + escapeHtml(u.morning_time || '—') + '</span>' +
            '<span>Ertalabki xabar uchun oxirgi urinish: ' + escapeHtml(shortDate(u.last_morning_greeting_date) || '—') + '</span>' +
          '</div>' +
        '</div>';
      });
    }

    html += '</div>';

    if (data.total_pages > 1) {
      html += '<div class="pagination">' +
        '<button class="page-btn" id="prevPage" type="button"' + (data.page <= 1 ? ' disabled' : '') + '>‹</button>' +
        '<span style="font-size:12px;color:var(--text-dim);">' + data.page + ' / ' + data.total_pages + '</span>' +
        '<button class="page-btn" id="nextPage" type="button"' + (data.page >= data.total_pages ? ' disabled' : '') + '>›</button>' +
      '</div>';
    }

    contentEl.innerHTML = html + dataNotes(data);

    const searchInput = document.getElementById('userSearch');
    if (searchInput) {
      if (restoreSearch) { searchInput.focus(); searchInput.setSelectionRange(selection, selection); }
      searchInput.addEventListener('input', function (e) {
        loadVersion++;
        usersSearch = e.target.value;
        clearTimeout(searchDebounce);
        searchDebounce = setTimeout(function () {
          usersPage = 1;
          loadUsers();
        }, 350);
      });
    }

    const prevBtn = document.getElementById('prevPage');
    const nextBtn = document.getElementById('nextPage');
    if (prevBtn) prevBtn.addEventListener('click', function () { haptic('light'); usersPage--; loadUsers(); });
    if (nextBtn) nextBtn.addEventListener('click', function () { haptic('light'); usersPage++; loadUsers(); });
  }

  function segmentRow(name, count) {
    return '<div class="segment-row"><span class="seg-name">' + name + '</span><span class="seg-count">' + count + '</span></div>';
  }

  function loadUsers() {
    const request = ++loadVersion;
    if (contentEl.querySelector('.segment-list') === null) showSkeleton();
    const params = '?page=' + usersPage + '&page_size=20' +
      (usersSearch ? '&search=' + encodeURIComponent(usersSearch) : '');
    apiFetch('/users' + params).then(function (data) {
      if (currentTab !== 'users' || request !== loadVersion) return;
      renderUsers(data);
    }).catch(function (err) { if (request === loadVersion) handleLoadError(err); });
  }

  // ---------- Tab wiring ----------

  const loaders = {
    overview: loadOverview,
    activity: loadActivity,
    retention: loadRetention,
    users: loadUsers
  };

  function handleLoadError(err) {
    if (err.status === 403) {
      showError('Sizda admin huquqi yo\u2018q.', true);
      return;
    }
    showError(err.message || 'Ma\u2018lumotni yuklab bo\u2018lmadi');
  }

  function switchTab(tab) {
    if (!isAdminVerified) return;
    clearTimeout(searchDebounce);
    currentTab = tab;
    const meta = titles[tab];
    titleEl.textContent = meta[0];
    subtitleEl.textContent = meta[1];

    document.querySelectorAll('.nav-btn').forEach(function (btn) {
      const active = btn.dataset.tab === tab;
      btn.classList.toggle('active', active);
    });

    loaders[tab]();
  }

  document.querySelectorAll('.nav-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      if (btn.dataset.tab === currentTab) return;
      haptic('light');
      switchTab(btn.dataset.tab);
    });
  });

  document.getElementById('adminRefresh').addEventListener('click', function () { if (isAdminVerified) loaders[currentTab](); });

  // ---------- Initial admin check ----------

  showSkeleton();
  apiFetch('/me').then(function () {
    isAdminVerified = true;
    document.getElementById('adminRefresh').disabled = false;
    switchTab('overview');
  }).catch(function (err) {
    if (err.status === 403) {
      showError('Sizda admin huquqi yo\u2018q.', true);
    } else {
      showError(err.message || 'Tekshirishda xatolik yuz berdi');
    }
  });
})();
</script>

</body>
</html>
